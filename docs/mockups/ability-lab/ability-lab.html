<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ability Lab</title>
<style>
:root{--bg:#0a0c0f;--panel:#12151b;--line:#2a303b;--text:#e9ecf1;--mute:#8b93a3;--red:#ff3d5f;--cy:#3de8d8;--yel:#f2d541}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif;padding:12px;max-width:460px}
h1{font:700 20px Rajdhani,system-ui;letter-spacing:.06em;text-transform:uppercase;margin:6px 0}
h2{font:700 17px Rajdhani,system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--cy);margin:28px 0 4px}
p{color:var(--mute);margin:4px 0 8px}
p.decided{color:var(--yel)}
.card{background:var(--panel);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);padding:10px;margin:10px 0}
.card h3{margin:0 0 2px;font:700 15px Rajdhani,system-ui;letter-spacing:.05em;text-transform:uppercase}
.tag{font-size:11px;color:var(--yel);text-transform:uppercase;letter-spacing:.08em}
button{min-height:44px;padding:0 16px;background:#1b2029;color:var(--text);border:1px solid var(--cy);font:600 14px Rajdhani,system-ui;letter-spacing:.08em;text-transform:uppercase}
button.on{background:#12352f;border-color:var(--yel);color:var(--yel)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
svg{width:100%;display:block;background:#0e1218;border:1px solid var(--line);touch-action:manipulation}
.note{font-size:12px;color:var(--mute);border-left:2px solid var(--line);padding-left:8px;margin-top:6px}
label{font-size:13px;color:var(--mute)}
.ctl{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip-link{padding:8px 10px;border:1px solid var(--line);color:var(--text);text-decoration:none;font:600 13px Rajdhani,system-ui;letter-spacing:.06em;text-transform:uppercase}
pre.picks{background:#0e1218;border:1px solid var(--line);padding:8px;white-space:pre-wrap;font-size:12px}
.tok circle.b{stroke-width:1.6}
.crew circle.b{fill:#143a3a;stroke:var(--cy)} .foe circle.b{fill:#3a1420;stroke:var(--red)}
.tok text{font:700 8px Rajdhani,system-ui;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cover{fill:#242a35;stroke:#3a4252;stroke-width:1}
.tag-svg{font:700 8.5px Rajdhani,system-ui;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:3px;letter-spacing:.04em}
.float{font:700 11px Rajdhani,system-ui;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:3px}
</style></head><body>
<h1>Ability Lab</h1>
<p>Every special move and status, drawn three ways at phone width. Tap Play, tap Pick on the one you like, then Copy picks and paste them to Claude. Nothing here touches the game.</p>
<div class="ctl row">
  <label>Slow-down <input id="slow" type="range" min="0.5" max="2.5" step="0.1" value="1" style="width:120px"> <span id="slowv">1.0×</span></label>
  <label><input id="tapstep" type="checkbox"> Tap map to step</label>
</div>
<div id="root"></div>
<script src="kit.js"></script>
<!-- ABILITIES:START (scripts/new-ability-mockup.mjs adds a line here) -->
<script src="abilities/ricochet.js"></script>
<script src="abilities/slash.js"></script>
<script src="abilities/ping.js"></script>
<script src="abilities/shield.js"></script>
<script src="abilities/aura.js"></script>
<script src="abilities/jam.js"></script>
<script src="abilities/incendiary.js"></script>
<script src="abilities/contagion.js"></script>
<script src="abilities/mark.js"></script>
<script src="abilities/rout.js"></script>
<script src="abilities/breacher.js"></script>
<script src="abilities/alarm.js"></script>
<script src="abilities/overwatch.js"></script>
<script src="abilities/van.js"></script>
<script src="abilities/patch.js"></script>
<script src="abilities/death.js"></script>
<!-- ABILITIES:END -->
<script>
document.getElementById('slow').oninput = (e) => { Kit.st.S = +e.target.value; document.getElementById('slowv').textContent = Kit.st.S.toFixed(1) + '×'; };
document.getElementById('tapstep').onchange = (e) => { Kit.st.STEP = e.target.checked; };
Kit.render(document.getElementById('root'));
</script></body></html>
