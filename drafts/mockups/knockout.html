<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knockout: four alternatives (mockup, 2026-11-19)</title>
<!-- Mockup only (not the game): how an enemy that is knocked out of a fight could look on the stage, for the owner to pick.
     Top: each alternative loops live (a shot lands at 0.35 s, the knockout plays, it holds, then resets).
     Bottom: the same four as frame strips (each column the animation paused at that moment), so they can be compared on paper.
     Colours and sizes follow docs/UI-SKIN.md and the stage (enemy ring #ff4d5e, crew teal #36d6c3, Rajdhani). -->
<style>
  :root { --bg: #0b0d11; --panel: #12161d; --line: #262c38; --text: #e9ecf1; --muted: #8a93a3; --foe: #ff4d5e; --crew: #36d6c3; --amber: #ffd84d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 Rajdhani, system-ui, sans-serif; padding: 16px; max-width: 430px; margin-inline: auto; }
  h1 { font: 700 18px Rajdhani, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 4px; }
  h2 { font: 700 13px Rajdhani, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--crew); margin: 18px 0 8px; }
  p.note { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cell { background: var(--panel); border: 1px solid var(--line); clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); padding: 6px; }
  .cell b { display: block; font: 700 12px Rajdhani, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
  .cell small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.25; min-height: 30px; }
  svg { display: block; width: 100%; height: auto; }
  .strip { display: grid; grid-template-columns: 70px repeat(6, 1fr); gap: 3px; align-items: center; margin-bottom: 4px; }
  .strip .lab { font: 700 11px Rajdhani, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
  .strip .t { font: 600 10px Rajdhani, sans-serif; color: var(--muted); text-align: center; }
  .strip svg { background: var(--panel); border: 1px solid var(--line); }

  /* The pieces every alternative shares: the token, its ring, the HP bar, the shot. */
  .face { fill: #3a4252; } .face-skin { fill: #c9a07e; } .face-hair { fill: #2a1d18; }
  .ring { fill: none; stroke: var(--foe); stroke-width: 3; }
  .barbg { fill: #1b2029; } .barfill { fill: var(--foe); }
  .shot { stroke: var(--crew); stroke-width: 2; stroke-linecap: round; opacity: 0; }
  .num { font: 800 15px Rajdhani, sans-serif; fill: var(--foe); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; opacity: 0; }
  .word { font: 800 13px Rajdhani, sans-serif; letter-spacing: 0.14em; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; opacity: 0; }
  .tok, .tok * , .shard, .arc, .x, .word, .num, .flash, .body, .tag { transform-box: fill-box; transform-origin: center; }
  /* 3 s loop for everything; the strips pause it at a moment with a negative delay. */
  .a { animation-duration: 3s !important; animation-iteration-count: infinite !important; animation-timing-function: ease-out; animation-fill-mode: both; }
  @keyframes shot { 0%, 5% { opacity: 0; } 8% { opacity: 1; } 12%, 100% { opacity: 0; } }
  @keyframes bar { 0%, 11% { transform: scaleX(1); } 13%, 100% { transform: scaleX(0); } }
  @keyframes num { 0%, 11% { opacity: 0; transform: translateY(4px) scale(0.5); } 14% { opacity: 1; transform: translateY(0) scale(1.35); } 18% { transform: scale(1); } 40% { opacity: 1; transform: translateY(-10px); } 48%, 100% { opacity: 0; transform: translateY(-16px); } }

  /* A: Shatter. White flash, shards burst out, the face tips over and greys, DOWN pops, a red X stays. */
  .A .flash { fill: #fff; opacity: 0; animation-name: A-flash; } @keyframes A-flash { 0%, 11% { opacity: 0; transform: scale(0.6); } 13% { opacity: 0.95; transform: scale(1.15); } 22%, 100% { opacity: 0; transform: scale(1.6); } }
  .A .shard { fill: #fff; opacity: 0; animation-name: A-shard; } @keyframes A-shard { 0%, 12% { opacity: 0; transform: translate(0, 0) scale(1); } 13% { opacity: 1; } 30%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); } }
  .A .tok { animation-name: A-tip; } @keyframes A-tip { 0%, 12% { transform: rotate(0) translateY(0); filter: none; } 18% { transform: rotate(-8deg) translateY(-2px); } 30% { transform: rotate(78deg) translate(4px, 6px) scale(0.9); filter: grayscale(1) brightness(0.55); } 100% { transform: rotate(78deg) translate(4px, 6px) scale(0.9); filter: grayscale(1) brightness(0.55); } }
  .A .x { stroke: var(--foe); stroke-width: 4; stroke-linecap: square; fill: none; stroke-dasharray: 40; stroke-dashoffset: 40; animation-name: A-x; } @keyframes A-x { 0%, 30% { stroke-dashoffset: 40; } 38%, 100% { stroke-dashoffset: 0; } }
  .A .word { fill: var(--foe); animation-name: A-word; } @keyframes A-word { 0%, 20% { opacity: 0; transform: scale(0.4); } 25% { opacity: 1; transform: scale(1.4); } 30% { transform: scale(1); } 70% { opacity: 1; } 80%, 100% { opacity: 0; } }

  /* B: Fade to grey and an X. Quieter: the face greys out, a red X draws across it, DOWN shows. */
  .B .tok { animation-name: B-grey; } @keyframes B-grey { 0%, 12% { filter: none; opacity: 1; } 30%, 100% { filter: grayscale(1) brightness(0.5); opacity: 0.85; } }
  .B .x { stroke: var(--foe); stroke-width: 4; stroke-linecap: square; fill: none; stroke-dasharray: 40; stroke-dashoffset: 40; animation-name: B-x; } @keyframes B-x { 0%, 16% { stroke-dashoffset: 40; } 26%, 100% { stroke-dashoffset: 0; } }
  .B .word { fill: var(--foe); animation-name: B-word; } @keyframes B-word { 0%, 16% { opacity: 0; } 22% { opacity: 1; } 70% { opacity: 1; } 80%, 100% { opacity: 0; } }

  /* C: Ring snaps. The token shakes, its red ring breaks into four arcs that fly off, it shrinks and darkens, and an OUT tag stays under it. */
  .C .tok { animation-name: C-shake; } @keyframes C-shake { 0%, 12% { transform: translate(0) scale(1); filter: none; } 14% { transform: translate(-3px, 0); } 16% { transform: translate(3px, 0); } 18% { transform: translate(-2px, 0); } 20% { transform: translate(0) scale(1); } 32%, 100% { transform: scale(0.72); filter: grayscale(1) brightness(0.45); } }
  .C .ring { animation-name: C-ringgone; } @keyframes C-ringgone { 0%, 13% { opacity: 1; } 14%, 100% { opacity: 0; } }
  .C .arc { fill: none; stroke: var(--foe); stroke-width: 3; opacity: 0; animation-name: C-arc; } @keyframes C-arc { 0%, 13% { opacity: 0; transform: translate(0, 0) rotate(0); } 14% { opacity: 1; } 34%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
  .C .tag rect { fill: var(--foe); } .C .tag text { font: 800 10px Rajdhani, sans-serif; letter-spacing: 0.16em; fill: var(--bg); text-anchor: middle; }
  .C .tag { opacity: 0; animation-name: C-tag; } @keyframes C-tag { 0%, 26% { opacity: 0; transform: translateY(-4px) scale(0.6); } 32% { opacity: 1; transform: translateY(0) scale(1.15); } 36%, 100% { opacity: 1; transform: scale(1); } }

  /* D: Collapse. The token drops and squashes into a dark body on the ground, the face goes, a red cross marks the spot; KO pops. */
  .D .tok { animation-name: D-drop; } @keyframes D-drop { 0%, 12% { transform: translateY(0) scale(1, 1); opacity: 1; } 16% { transform: translateY(-3px) scale(1.06, 0.95); } 26% { transform: translateY(10px) scale(1.3, 0.25); opacity: 1; } 30%, 100% { transform: translateY(10px) scale(1.3, 0.25); opacity: 0; } }
  .D .body { fill: #5a1020; opacity: 0; animation-name: D-body; } @keyframes D-body { 0%, 24% { opacity: 0; transform: scale(0.4, 1); } 30%, 100% { opacity: 0.9; transform: scale(1); } }
  .D .x { stroke: var(--foe); stroke-width: 3.5; stroke-linecap: square; fill: none; opacity: 0; animation-name: D-x; } @keyframes D-x { 0%, 28% { opacity: 0; transform: scale(1.8); } 33%, 100% { opacity: 1; transform: scale(1); } }
  .D .word { fill: var(--amber); animation-name: D-word; } @keyframes D-word { 0%, 20% { opacity: 0; transform: translateY(6px) scale(0.5); } 26% { opacity: 1; transform: translateY(0) scale(1.5); } 32% { transform: scale(1); } 70% { opacity: 1; } 80%, 100% { opacity: 0; } }
</style>
</head>
<body>
<h1>Knockout · four ways</h1>
<p class="note">Mockup for the owner, not the game. Each one: a shot lands, the damage number pops, the HP bar empties, then the knockout. Pick one (or mix: "A's burst with C's tag").</p>

<h2>Live (loops)</h2>
<div class="grid" id="live"></div>

<h2>Frame by frame</h2>
<div id="strips"></div>

<script>
// One alternative as an SVG. `delay` (ms) pauses it at that moment for the strips; null loops it live.
const ALTS = {
  A: { name: 'A · Shatter', desc: 'Flash and shards, the face tips over and greys, DOWN pops, a red X stays.' },
  B: { name: 'B · Fade and X', desc: 'Quiet: the face greys out, a red X draws across, DOWN shows.' },
  C: { name: 'C · Ring snaps', desc: 'A shake, the ring breaks and flies off, the face shrinks dark, an OUT tag stays.' },
  D: { name: 'D · Collapse', desc: 'The body drops flat to a dark mark on the ground with a red cross; KO pops.' },
};
function svgFor(k, delay) {
  const st = delay == null ? '' : `animation-delay:-${delay}ms;animation-play-state:paused;`;
  const a = (extra = '') => `class="a ${extra}" style="${st}"`;
  const face = `<g ${a('tok')}><circle r="22" class="face"/><circle cy="4" r="11" class="face-skin"/><path d="M-12 -2 Q0 -18 12 -2 L12 -6 Q0 -22 -12 -6Z" class="face-hair"/><circle r="22" ${k === 'C' ? a('ring') : 'class="ring"'}/></g>`;
  const shot = `<line x1="-46" y1="44" x2="-6" y2="6" ${a('shot')} style="${st}animation-name:shot"/>`;
  const bar = `<rect x="-20" y="28" width="40" height="4" class="barbg"/><rect x="-20" y="28" width="40" height="4" class="barfill a" style="${st}animation-name:bar;transform-box:fill-box;transform-origin:left center"/>`;
  const num = `<text x="0" y="-30" ${a('num')} style="${st}animation-name:num">−20</text>`;
  let fx = '';
  if (k === 'A') {
    fx += `<circle r="24" ${a('flash')}/>`;
    for (let i = 0; i < 8; i++) { const ang = (i / 8) * Math.PI * 2; fx += `<rect x="-1.5" y="-4" width="3" height="8" ${a('shard')} style="${st}--dx:${Math.cos(ang) * 34}px;--dy:${Math.sin(ang) * 34}px;transform:rotate(${(ang * 180) / Math.PI}deg)"/>`; }
    fx += `<path d="M-13 -13 L13 13 M13 -13 L-13 13" ${a('x')} transform="translate(4 6)"/><text x="0" y="-36" ${a('word')}>DOWN</text>`;
  }
  if (k === 'B') fx += `<path d="M-15 -15 L15 15 M15 -15 L-15 15" ${a('x')}/><text x="0" y="-36" ${a('word')}>DOWN</text>`;
  if (k === 'C') {
    const arcs = [['M22 0 A22 22 0 0 1 0 22', 30, 30, 70], ['M0 22 A22 22 0 0 1 -22 0', -30, 30, -70], ['M-22 0 A22 22 0 0 1 0 -22', -30, -30, 60], ['M0 -22 A22 22 0 0 1 22 0', 30, -30, -60]];
    for (const [d, dx, dy, r] of arcs) fx += `<path d="${d}" ${a('arc')} style="${st}--dx:${dx}px;--dy:${dy}px;--r:${r}deg"/>`;
    fx += `<g ${a('tag')} style="${st}transform-origin:center"><rect x="-17" y="34" width="34" height="13"/><text x="0" y="44.5">OUT</text></g>`;
  }
  if (k === 'D') fx += `<ellipse cx="0" cy="13" rx="26" ry="8" ${a('body')}/><path d="M-9 4 L9 22 M9 4 L-9 22" ${a('x')}/><text x="0" y="-26" ${a('word')}>KO</text>`;
  return `<svg viewBox="-60 -60 120 120" class="${k}" role="img" aria-label="${ALTS[k].name}">${shot}${k === 'D' ? fx.split('<path')[0] : ''}${face}${bar}${k === 'D' ? '<path' + fx.split('<path')[1] : fx}${num}</svg>`;
}
document.getElementById('live').innerHTML = Object.keys(ALTS).map((k) => `<div class="cell"><b>${ALTS[k].name}</b><small>${ALTS[k].desc}</small>${svgFor(k, null)}</div>`).join('');
const TIMES = [300, 420, 600, 800, 1100, 2000];
document.getElementById('strips').innerHTML = `<div class="strip"><span></span>${TIMES.map((t) => `<span class="t">${(t / 1000).toFixed(2)} s</span>`).join('')}</div>`
  + Object.keys(ALTS).map((k) => `<div class="strip"><span class="lab">${ALTS[k].name.split(' · ')[0]} · ${ALTS[k].name.split(' · ')[1]}</span>${TIMES.map((t) => svgFor(k, t)).join('')}</div>`).join('');
</script>
</body>
</html>
