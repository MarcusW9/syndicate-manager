<style>
/* Layout: one phone-width column. Plan = approach, then the squad board, then the coverage read, with a
   sticky action bar. Watch = sticky map + alert track over a phased feed. Report = verdict first.
   Deliberately single dark theme: the game's street-terminal skin (src/ui/styles.css). */
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1c2029;
  --line: #262b36;
  --text: #e7e9ee;
  --muted: #8b93a7;
  --accent: #ff4f7b;
  --accent-2: #36d6c3;
  --warn: #f5b942;
  --danger: #ff5a5a;
  --good: #5fe0a5;
  --sel: #13221f;
  --paper: #e9e4d8;
  --ink: #1b1d22;
  --display: 'Rajdhani', 'Arial Narrow', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --tap: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.wrap { max-width: 540px; margin: 0 auto; display: grid; gap: 18px; padding-bottom: 96px; }
.wrap.no-bar { padding-bottom: 24px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.02em; line-height: 1.1; }
h2 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font: 400 0.75rem var(--body); letter-spacing: 0; text-transform: none; text-align: right; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.tag { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; border: 1px dashed var(--muted); color: var(--muted); border-radius: 4px; padding: 1px 6px; }
.brief { color: #c9cdd8; font-style: italic; font-size: 0.92rem; border-left: 2px solid var(--accent); padding-left: 10px; }
details.how { font-size: 0.82rem; color: var(--muted); }
details.how summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; color: var(--accent-2); }
details.how ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px; }
section { display: grid; gap: 8px; }

/* Map */
.map { position: relative; background: #0b0d11; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .route { fill: none; stroke: var(--accent-2); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.map .exit { fill: none; stroke: #2c3240; stroke-width: 2; stroke-dasharray: 4 5; stroke-linejoin: round; }
.map .exit.on { stroke: var(--warn); stroke-dasharray: none; }
.map .sight { fill: rgba(255, 79, 123, 0.06); stroke: rgba(255, 79, 123, 0.25); stroke-dasharray: 3 4; }
.map .node { fill: #171a21; stroke: #3a4254; stroke-width: 1.5; }
.map .node.post { stroke: var(--accent); fill: #2a1520; }
.map .node.crane { stroke: var(--warn); }
.map .label { fill: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; }
.map .label.hi { fill: var(--text); }
.map .token circle { stroke: var(--bg); stroke-width: 2; }
.map .token text { fill: var(--bg); font-family: var(--display); font-weight: 700; font-size: 9px; text-anchor: middle; dominant-baseline: central; }
.map .token { transition: transform 0.8s ease-in-out, opacity 0.4s; }
.map .token.down circle { stroke: var(--danger); stroke-width: 3; }
.map .water { fill: #0d1620; }
.map .stack { fill: #141821; stroke: #232937; }
.map .office { fill: #191c25; stroke: #3a4254; }
.map .alarm { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.map .alarm.on { animation: pulse 1.2s ease-out infinite; }
.map .shot { stroke: var(--warn); stroke-width: 2; stroke-linecap: round; animation: shot 0.7s ease-out forwards; }
.map .dronefx { fill: var(--accent-2); }
@keyframes pulse { from { transform: scale(1); opacity: 0.9; } to { transform: scale(3.5); opacity: 0; } }
@keyframes shot { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .map .token { transition: none; } .map .alarm.on { animation: none; opacity: 0.8; transform: scale(2); } }

/* Approach cards */
.approaches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { width: 100%; text-align: left; display: grid; gap: 4px; align-content: start; min-height: var(--tap); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.card[aria-pressed="true"] { border-color: var(--accent-2); background: var(--sel); box-shadow: inset 3px 0 0 var(--accent-2); }
.card b { font-family: var(--display); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.03em; }
.card__body { font-size: 0.8rem; color: var(--muted); }
.card__meta { font-family: var(--mono); font-size: 0.68rem; color: #a9b0c2; }
.card__cost { font-family: var(--mono); font-size: 0.68rem; color: var(--warn); }
.exits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Risk pills */
.pill { font-family: var(--mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; flex: none; }
.r-low { color: var(--good); } .r-moderate { color: var(--accent-2); } .r-high { color: var(--warn); } .r-extreme, .r-gap { color: var(--danger); } .r-certain, .r-safe, .r-none { color: var(--muted); }

/* Squad board */
.board { display: grid; gap: 12px; padding: 14px 12px 12px; border-radius: 12px; border: 1px solid #2a2f3b; background:
  radial-gradient(circle at 20% 10%, rgba(54, 214, 195, 0.06), transparent 40%),
  repeating-linear-gradient(0deg, transparent 0 19px, rgba(139, 147, 167, 0.07) 19px 20px),
  repeating-linear-gradient(90deg, transparent 0 19px, rgba(139, 147, 167, 0.07) 19px 20px), #12151b; }
.board__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.board__head p { font-size: 0.78rem; color: var(--muted); min-width: 0; }
.jossbtn { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #1f4440; background: #10201e; color: var(--accent-2); font: 600 0.88rem var(--display); letter-spacing: 0.04em; cursor: pointer; white-space: nowrap; }
.group { display: grid; gap: 6px; }
.group__label { font: 700 0.72rem var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.group__label span { font: 400 0.72rem var(--body); letter-spacing: 0; text-transform: none; }
.dossiers { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; }
.dossier { position: relative; display: grid; justify-items: center; align-content: start; gap: 3px; padding: 15px 5px 8px; min-height: 172px; text-align: center; border-radius: 4px; cursor: pointer;
  background: var(--paper); color: var(--ink); border: 0; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45); transform: rotate(var(--tilt, 0deg)); transition: transform 0.15s; }
.dossier > * { max-width: 100%; }
.dossier:hover { transform: rotate(0deg) translateY(-2px); }
.dossier::before { content: ""; position: absolute; top: 5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--pin, var(--accent)); box-shadow: 0 2px 2px rgba(0, 0, 0, 0.5); }
.dossier__photo { width: 56px; height: 56px; border-radius: 2px; overflow: hidden; background: #1b1f28; outline: 3px solid #fff; }
.dossier__photo svg { width: 100%; height: 100%; display: block; }
.dossier__name { font: 700 0.98rem var(--display); line-height: 1.05; }
.dossier__real { font-size: 0.62rem; color: #5a5f6c; line-height: 1.15; }
.dossier .pill { font-size: 0.56rem; padding: 0 6px; background: var(--ink); }
.dossier__spec { font: 600 0.56rem var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: #fff; background: #7a4b0c; border-radius: 3px; padding: 1px 5px; }

.dossier.empty { background: transparent; color: var(--muted); border: 2px dashed #3a4254; box-shadow: none; align-content: center; min-height: 120px; }

.dossier.empty b { font: 700 0.7rem var(--display); letter-spacing: 0.12em; text-transform: uppercase; }
.kit { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.kit button { min-height: 36px; background: transparent; border: 0; border-radius: 7px; font: 600 0.88rem var(--display); cursor: pointer; color: var(--muted); }
.kit button[aria-pressed="true"] { background: var(--sel); color: var(--accent-2); box-shadow: inset 0 0 0 1px var(--accent-2); }

/* Coverage read */
.cover { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cover__row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-top: 1px solid var(--line); align-items: center; }
.cover__row:first-child { border-top: 0; }
.cover__row b { font-weight: 600; font-size: 0.9rem; }
.cover__row small { grid-column: 1; font-size: 0.75rem; color: var(--muted); }
.cover__row .risk { grid-row: span 2; display: grid; justify-items: end; gap: 3px; }
.cover__row .with { font-family: var(--mono); font-size: 0.6rem; color: var(--muted); text-transform: uppercase; }
.cover__row.gap { background: #1e1416; }
.cover__note { padding: 9px 12px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--warn); }

/* Orders */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { min-height: 40px; background: transparent; border: 0; border-radius: 7px; font: 600 0.92rem var(--display); letter-spacing: 0.02em; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--accent-2); box-shadow: inset 0 0 0 1px var(--accent-2); }
.order { display: grid; gap: 6px; }
.order p { font-size: 0.84rem; }
.order .muted { font-size: 0.76rem; }

/* Sticky action bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(15, 17, 21, 0.96); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar__in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.bar__sum { display: grid; gap: 2px; min-width: 0; }
.bar__sum b { font-family: var(--display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.bar__sum span { font-size: 0.74rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { min-height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 700 1.05rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn--ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }

/* Picker sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5, 6, 9, 0.6); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82vh; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(30%); opacity: 0.4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .dossier { transition: none; } }
.sheet__in { max-width: 540px; margin: 0 auto; display: grid; gap: 8px; }
.sheet__head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.sheet__head h3 { font: 700 1.3rem var(--display); }
.sheet__head p { font-size: 0.8rem; color: var(--muted); }
.x { min-width: var(--tap); min-height: var(--tap); background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
.cand { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; min-height: 60px; padding: 6px 10px 6px 6px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.cand[aria-pressed="true"] { border-color: var(--accent-2); background: var(--sel); }
.cand.remove { grid-template-columns: 1fr; min-height: var(--tap); color: var(--muted); }
.cand__ph { width: 48px; height: 48px; border-radius: 6px; overflow: hidden; background: #0b0d11; }
.cand__ph svg { width: 100%; height: 100%; display: block; }
.cand__txt { display: grid; gap: 1px; min-width: 0; }
.cand__txt b { font: 700 1.02rem var(--display); }
.cand__txt span { font-size: 0.74rem; color: var(--muted); }
.cand__side { display: grid; justify-items: end; gap: 3px; }
.cand__side small { font: 500 0.6rem var(--mono); text-transform: uppercase; color: var(--muted); }

/* Watch */
.live { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 4px 8px; display: grid; gap: 6px; }
.live .map svg { height: min(24vh, 190px); }
.tally { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--mono); font-size: 0.72rem; align-items: center; }
.tally > span { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.tally .phase { color: var(--accent-2); border-color: #1f4440; }
.tally .bad { color: var(--danger); border-color: #4a2224; }
.alert { display: inline-flex; gap: 3px; align-items: center; }
.alert i { width: 9px; height: 9px; border-radius: 2px; background: var(--line); display: inline-block; }
.alert i.on { background: var(--danger); }
.feed { display: grid; gap: 6px; }
.feed > * { scroll-margin-bottom: 96px; }
.phasehead { font: 700 0.75rem var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-2); padding-top: 8px; display: flex; gap: 8px; align-items: center; }
.phasehead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.line { padding: 6px 0 6px 12px; border-left: 2px solid var(--line); font-size: 0.92rem; animation: in 0.35s ease-out; }
.line.beat { color: #c9cdd8; font-style: italic; }
.line.inc { border-color: #3a4254; }
.line.good { border-color: var(--good); }
.line.bad { border-color: var(--danger); }
.line.save { border-color: var(--warn); background: #1f1b12; border-radius: 0 8px 8px 0; padding: 7px 10px 7px 12px; }
.line.crisis { border-color: var(--accent); background: #1a1418; border-radius: 0 8px 8px 0; padding: 8px 10px 8px 12px; font-weight: 500; }
.line.why { font-size: 0.8rem; color: var(--muted); }
.line .kind { display: block; font: 600 0.6rem var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px; }
.who { font-family: var(--display); font-weight: 700; letter-spacing: 0.02em; }
.dice { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); background: none; border: 0; padding: 0 0 0 4px; cursor: pointer; text-decoration: underline dotted; min-height: 24px; }
.dice-detail { display: block; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
@keyframes in { from { opacity: 0.2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .line { animation: none; } }
.callin { border: 1px solid var(--accent); background: #1d1418; border-radius: 12px; padding: 12px; display: grid; gap: 8px; animation: in 0.35s ease-out; }
.callin__q { font-size: 0.95rem; }
.callin .eyebrow { color: var(--accent); }
.choice { min-height: var(--tap); text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; cursor: pointer; display: grid; gap: 3px; }
.choice:hover:not(:disabled) { border-color: var(--accent-2); }
.choice:disabled { cursor: default; opacity: 0.5; }
.choice.picked { opacity: 1; border-color: var(--accent-2); }
.choice__top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.choice__top > span:first-child { min-width: 0; }
.choice__sub { font-size: 0.75rem; color: var(--muted); }
.crewpick { font-family: var(--mono); font-size: 0.6rem; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.06em; }

/* Report */
.joss { font-size: 1.02rem; border-left: 2px solid var(--accent-2); padding-left: 12px; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 8px; display: grid; gap: 2px; }
.fact b { font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.planline { display: flex; flex-wrap: wrap; gap: 6px; }
.planline span { font-family: var(--mono); font-size: 0.7rem; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: #b4bacb; }

ul.check li.ok i { color: var(--good); } ul.check li.no i { color: var(--danger); } ul.check li.meh i { color: var(--muted); } ul.check li.sv i { color: var(--warn); }

.money div { display: flex; justify-content: space-between; gap: 8px; }
.money div:last-child { border-top: 1px solid var(--line); padding-top: 4px; color: var(--text); font-weight: 500; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seed { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); text-align: center; }

<script>
// ---------- Rules (the game's own: success if d20 + stat >= 10 + difficulty) ----------
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const chanceOf = (stat, diff) => Math.min(0.95, Math.max(0.05, (21 - (10 + diff - stat)) / 20));
const riskOf = (c) => (c >= 0.75 ? 'low' : c >= 0.5 ? 'moderate' : c >= 0.3 ? 'high' : 'extreme');
const RISK_ORDER = ['safe', 'low', 'moderate', 'high', 'extreme'];
const worst = (list) => list.reduce((a, b) => (RISK_ORDER.indexOf(b) > RISK_ORDER.indexOf(a) ? b : a), 'safe');
const yen = (n) => (n < 0 ? '-¥' : '¥') + Math.abs(Math.round(n)).toLocaleString();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
const pill = (risk, text = risk) => `<span class="pill r-${risk}">${text}</span>`;

// ---------- The crew: the five founders, plus two hires so there's a bench ----------
const CREW = [

// ---------- Odds (the read and the run use the same functions) ----------
// An inside roll: stat, +1 if the approach leans on it, −1 per extra inside body on stealth and con
// runs when the stat is stealth or social, + alert, −2 if lightly hurt.
function insideRoll(op, stat, diff, { approach = plan.approach, team = insideOps(), alert = 0, hurt = {} } = {}) {
  let value = op.stats[stat];
  const notes = [`${stat} ${op.stats[stat]}`];
  if (APPROACHES[approach].lean.includes(stat)) { value += 1; notes.push(`${APPROACHES[approach].name.toLowerCase()} approach +1`); }
  const extra = Math.max(0, team.length - 2);
  if (extra && APPROACHES[approach].detect && (stat === 'stealth' || stat === 'social')) { value -= extra; notes.push(`${team.length} inside −${extra}`); }
  if (hurt[op.id] === 'light') { value -= 2; notes.push('hurt −2'); }
  const d = diff + alert;
  if (alert) notes.push(`alert +${alert} difficulty`);
  const chance = chanceOf(value, d);
  return { op, stat, value, diff: d, need: 10 + d, chance, risk: riskOf(chance), notes };
}
// Who handles an incident: whoever on the inside team has the best odds with any stat it allows.
function handler(inc, ctx = {}) {
  const team = (ctx.team ?? insideOps()).filter((o) => !(ctx.out ?? new Set()).has(o.id));
  let best = null;
  for (const op of team) for (const st of inc.stats) {
    const r = insideRoll(op, st, inc.diff, { ...ctx, team: ctx.team ?? insideOps() });
    if (!best || r.chance > best.chance) best = r;
  }
  return best;
}
// The best save for a person in trouble: overwatch (if they can see the spot and have shots/battery left),
// or the best fighter inside with them (+1 if bonded to the person in trouble).
function bestSave(victim, zoneId, { team = insideOps(), out = new Set(), overLeft = shotsFor(), slots = plan.slots, kit = plan.kit } = {}) {
  const options = [];
  const over = slots.over ? byId(slots.over) : null;
  if (over && overLeft > 0 && (kit === 'drone' || ZONES.find((z) => z.id === zoneId).sniper)) {
    const stat = kit === 'rifle' ? 'combat' : 'tech';
    let value = over.stats[stat];
    const notes = [`${stat} ${value}`];
    if ((kit === 'rifle' && over.spec === 'marksman') || (kit === 'drone' && over.spec === 'jockey')) { value += 1; notes.push(`${SPEC[over.spec]} +1`); }
    if (bonded(over.id, victim.id)) { value += 1; notes.push('bond +1'); }
    options.push({ kind: 'overwatch', op: over, stat, value, need: 10 + SAVE_DIFF.overwatch, chance: chanceOf(value, SAVE_DIFF.overwatch), notes });
  }
  for (const op of team) {
    if (op.id === victim.id || out.has(op.id)) continue;
    let value = op.stats.combat;
    const notes = [`combat ${value}`];
    if (bonded(op.id, victim.id)) { value += 1; notes.push('bond +1'); }

function shotsFor(slots = plan.slots, kit = plan.kit) {

  return over.spec === 'jockey' ? 4 : 3;
}

// The coverage read: every incident this approach tends to meet, who handles it, and what a save adds.
function coverage() {
  const team = insideOps();
  const rows = [];
  const seen = new Set();
  const add = (id, zoneId, note) => {
    if (seen.has(id)) return;
    seen.add(id);
    const inc = INC[id];
    const h = team.length ? handler(inc, { team }) : null;
    if (!h) { rows.push({ id, inc, zoneId, note, risk: 'gap', who: 'nobody' }); return; }
    let eff = h.chance;
    let save = null;
    if (inc.danger) {
      save = bestSave(h.op, zoneId, { team });
      if (save) eff = h.chance + (1 - h.chance) * save.chance;
    }
    rows.push({ id, inc, zoneId, note, risk: h.risk, eff: riskOf(eff), who: `${h.op.handle} (${h.stat} ${h.value})`, save, gap: riskOf(eff) === 'extreme' });

  if (plan.approach !== 'loud') add('guard', 'yard', 'Off-approach, sometimes');
  add('safe', 'office', 'The target');
  return rows;
}
function jossPicks() {
  const lean = APPROACHES[plan.approach].lean[0];
  const used = new Set();
  const take = (score) => { const op = [...CREW].filter((o) => !used.has(o.id)).sort((a, b) => score(b) - score(a))[0]; used.add(op.id); return op.id; };
  const slots = { in0: null, in1: null, in2: null, in3: null, over: null, wheels: null, standby: null };
  if (plan.exit === 'van') slots.wheels = take((o) => o.stats.driving);
  slots.over = take((o) => (plan.kit === 'rifle' ? o.stats.combat + (o.spec === 'marksman' ? 3 : 0) : o.stats.tech + (o.spec === 'jockey' ? 3 : 0)) - (o.stats[lean] >= 10 ? 4 : 0));
  slots.in0 = take((o) => o.stats[lean]);
  slots.in1 = take((o) => Math.max(o.stats.tech, o.stats.stealth, o.stats.social));
  if (!APPROACHES[plan.approach].detect) slots.in2 = take((o) => o.stats.combat);
  slots.standby = take((o) => o.stats.combat + o.stats.medical / 2);
  return slots;
}
// Put someone in a slot; if they're in another slot, the two swap (an empty slot just empties).
function swapIn(slotId, opId) {
  const from = activeSlots().find((s) => s !== slotId && plan.slots[s] === opId);
  const next = { ...plan.slots, [slotId]: opId };
  if (from) next[from] = plan.slots[slotId];
  return next;
}

// The picker: the crew sorted by fit for this slot, with what they'd bring.

// ---------- The run ----------
let fast = false;
const wait = (ms) => new Promise((r) => setTimeout(r, fast ? 50 : ms));

async function run() {
  const rng = mulberry32(seed);

  const S = structuredClone(plan.slots);
  const kit = plan.kit;
  const approach = plan.approach;
  let team = insideOps(S);
  const over = S.over ? byId(S.over) : null;
  const wheels = S.wheels ? byId(S.wheels) : null;
  let standby = S.standby ? byId(S.standby) : null;
  const log = { alert: 0, heat: approach === 'loud' ? 1 : 0, neural: {}, payCut: 0, hurt: {}, out: new Set(), saves: [], fails: [], passes: [], aborted: false, callIns: 0, standbyIn: false, rescued: null, wentLoud: false, events: [] };
  let overLeft = shotsFor(S, kit);
  let arriving = null; // { op, in: incidents left }
  fast = false;

  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `<div class="live"><div class="map">${mapSvg({ ...plan, slots: S })}</div><div class="tally" id="tally"></div></div><div class="feed" id="feed" aria-live="polite"></div>`;

    const g = document.getElementById('tokens');

  };
  const alarm = (at) => { const a = document.getElementById('alarm'); if (!a) return; if (!at) { a.classList.remove('on'); return; } a.setAttribute('cx', at[0]); a.setAttribute('cy', at[1]); a.classList.add('on'); };

    } else pick = await callIn('The crew is calling in', '"They know we\'re here. What now?"', opts);
    alarm(null);
    if (pick === 'out') { log.aborted = true; await say('The crew go back the way they came, fast and low.', 'bad', 1000); return false; }
    if (pick === 'loud') { log.wentLoud = true; log.heat += 2; log.alert = 2; tally(); await say('No more sneaking. The crew moves fast and stops pretending.', 'why', 900); return true; }
    arriving = { op: standby, in: 1 }; log.standbyIn = true; log.alert = 2; tally();
    await say(`${who(standby)} is on the way from the van.`, 'why', 900);
    return true;
  };

  // A serious injury: rescue with standby, keep going, or pull out.
  const injuryCall = async (op) => {
    let pick;
    const opts = [
      ...(standby && !arriving ? [{ label: `Send ${esc(standby.handle)} in to get ${esc(op.handle)} out`, sub: `${esc(standby.handle)} takes their place.`, value: 'rescue' }] : []),
      { label: `Keep going without ${esc(op.handle)}`, sub: 'They stay with the group but can\'t act.', value: 'keep' },
      { label: 'Pull everyone out', sub: 'No pay.', value: 'out', risk: 'certain' },
    ];
    if (plan.callIn === 'never') { pick = opts[0].value; await say(`Under your orders, the crew ${pick === 'rescue' ? `send for ${who(standby)}` : pick === 'keep' ? 'keep going' : 'pull out'}.`, 'why', 900); }
    else pick = await callIn(`${op.handle} is down`, `"${esc(op.handle)}'s badly hurt. Your call."`, opts);
    if (pick === 'out') { log.aborted = true; await say('The crew carry them out between them.', 'bad', 1000); return false; }
    if (pick === 'rescue') {
      log.rescued = { by: standby.handle, who: op.handle };
      await say(`${who(standby)} comes in fast, gets an arm under ${who(op)} and walks them back to the van.`, 'save', 1300, 'Rescue');
      team = [...team.filter((o) => o.id !== op.id), standby];
      standby = null; log.standbyIn = true;
      tokens(); moveGroup(here);
    }
    return true;
  };

  // One incident: the best-placed person rolls; a danger failure can be saved; unsaved failures raise the alert.
  const incident = async (id, zoneId) => {
    let inc = INC[id];
    if (log.wentLoud && !inc.danger && id !== 'safe') inc = INC.guard;
    const h = handler(inc, { approach, team, alert: log.alert, hurt: log.hurt, out: log.out });
    if (!h) { await say('Nobody is fit to deal with it.', 'bad', 800); log.alert += 1; tally(); return; }
    const op = h.op;
    await say(fillWho(inc.text, op), 'inc', 1000, inc.name);
    const die = d20();
    const ok = die + h.value >= h.need;
    log.events.push({ name: inc.name, op: op.handle, ok, risk: h.risk });
    if (ok) { log.passes.push(inc.name); await say(`${fillWho(inc.ok, op)} ${diceHtml(h, die)}`, 'good', 1100); await arrive(); return; }
    await say(`${fillWho(inc.bad, op)} ${diceHtml(h, die)}`, 'bad', 1100);
    if (inc.conseq.neural) { log.neural[op.handle] = (log.neural[op.handle] ?? 0) + inc.conseq.neural; await say(`${who(op)} takes neural load (+${inc.conseq.neural}).`, 'why', 700); }
    if (inc.danger) {
      await say(fillWho(inc.comp, op), 'bad', 900);
      const sv = bestSave(op, zoneId, { team, out: log.out, overLeft, slots: S, kit });
      if (sv) {
        const sdie = d20();
        const saved = sdie + sv.value >= sv.need;
        const sr = { value: sv.value, need: sv.need, notes: sv.notes };
        if (sv.kind === 'overwatch') {
          overLeft -= 1;
          await fx(kit === 'rifle' ? 'shot' : 'drone', ZONE_AT[zoneId]);
          if (kit === 'rifle') log.heat += over.spec === 'marksman' && saved ? 0 : 1;
          else log.neural[sv.op.handle] = (log.neural[sv.op.handle] ?? 0) + (over.spec === 'jockey' ? 5 : 10);
        }
        tally();
        const line = sv.kind === 'overwatch'
          ? (kit === 'rifle' ? (saved ? `${who(sv.op)} takes the shot from the crane. The threat drops.` : `${who(sv.op)}'s shot sparks off steel. Too high.`) : (saved ? `${who(sv.op)}'s drone drops in and tases the guard.` : `${who(sv.op)}'s drone clips a cable and spins away.`))
          : (saved ? `${who(sv.op)} comes round the stack and pulls ${who(op)} clear.` : `${who(sv.op)} goes for it, but can't get there in time.`);
        await say(`${line} ${diceHtml(sr, sdie)}`, saved ? 'save' : 'bad', 1300, saved ? 'Saved' : 'Save failed');
        if (saved) { log.saves.push({ by: sv.op.handle, who: op.handle, how: sv.kind === 'overwatch' ? (kit === 'rifle' ? 'shot' : 'drone') : 'hands' }); await arrive(); return; }
      } else {
        await say('Nobody is in a position to help.', 'why', 800);
      }
    }
    // Unsaved: the consequence lands.
    log.fails.push(inc.name);
    log.alert = Math.min(3, log.alert + (inc.conseq.alert ?? 0));
    log.heat += inc.conseq.heat ?? 0;
    log.payCut += inc.conseq.payCut ?? 0;
    tally();
    if (inc.conseq.injury) {
      const serious = rng() < 0.25 + 0.15 * log.alert;
      if (serious) {
        const medic = able().filter((o) => o.id !== op.id).sort((a, b) => b.stats.medical - a.stats.medical)[0];
        let patched = false;
        if (medic && medic.stats.medical >= 7) {
          const mr = { value: medic.stats.medical, need: 17, notes: [`medical ${medic.stats.medical}`] };
          const mdie = d20();
          patched = mdie + mr.value >= mr.need;
          await say(`${who(medic)} gets to ${who(op)} and works fast. ${patched ? 'Bad, but they can walk.' : 'It\'s worse than it looks.'} ${diceHtml(mr, mdie)}`, patched ? 'save' : 'bad', 1200, 'Patch-up');
        }
        if (!patched) {
          log.hurt[op.id] = 'serious'; log.out.add(op.id); markDown(op); tally();
          await say(`${who(op)} is seriously hurt and out of the job.`, 'bad', 1000);
          if (!(await injuryCall(op))) return 'stop';
          await arrive();
          return log.alert >= 3 ? 'alert' : undefined;
        }
      }
      log.hurt[op.id] = 'light'; tally();
      await say(`${who(op)} is hurt. Light: −2 for the rest of the run.`, 'bad', 900);
    }
    await arrive();
    if (!able().length) { log.aborted = true; await say('Nobody left standing to finish it. The crew pull out.', 'bad', 1000); return 'stop'; }
    return log.alert >= 3 ? 'alert' : undefined;
  };

  // A crisis from the real game: a call-in when the orders say so.
  const crisis = async (cid, roller = null) => {
    const cr = C[cid];
    const opts = cr.choices.map((c) => {
      const op = roller ?? able().sort((a, b) => b.stats[c.stat] - a.stats[c.stat])[0];
      const r = roller ? { op, value: op.stats[c.stat], diff: c.diff, need: 10 + c.diff, chance: chanceOf(op.stats[c.stat], c.diff), notes: [`${c.stat} ${op.stats[c.stat]}`] } : insideRoll(op, c.stat, c.diff, { approach, team, alert: log.alert, hurt: log.hurt });
      r.risk = riskOf(r.chance);
      return { c, r };
    }).sort((a, b) => b.r.chance - a.r.chance);
    await say(esc(cr.text), 'crisis', 1300, cr.name);
    let picked;
    if (plan.callIn === 'every' || (plan.callIn === 'risky' && opts[0].r.chance < 0.5)) {
      picked = await callIn(`${opts[0].r.op.handle} is calling in`, `"${esc(cr.name)}. What do we do?"`, [
        ...opts.map((o, i) => ({ label: fillWho(o.c.label, o.r.op), risk: o.r.risk, value: o, sub: `${i === 0 ? '<span class="crewpick">Crew\'s pick · </span>' : ''}${esc(o.r.op.handle)}: ${esc(o.r.notes.join(', '))}${o.c.failHurt ? ' · can hurt' : ''}${o.c.failHeat ? ' · heat if it fails' : ''}` })),
        { label: esc(cr.abort.label), risk: 'certain', value: 'abort', sub: 'Nobody\'s hurt. You lose the pay.' },
      ]);
    } else {
      picked = opts[0];
      await say(`${who(picked.r.op)}'s call: ${fillWho(lowerFirst(picked.c.label), picked.r.op)}. The best odds they had (${picked.r.risk}).`, 'why', 900);
    }
    if (picked === 'abort') { log.aborted = true; log.payCut = cr.abort.payCut ?? 1; await say(esc(cr.abort.ok), 'bad', 1000); return false; }
    const { c, r } = picked;
    const die = d20();
    const ok = die + r.value >= r.need;
    log.events.push({ name: cr.name, op: r.op.handle, ok, risk: r.risk });
    if (c.payCut) log.payCut += c.payCut;
    if (!ok) { log.heat += c.failHeat ?? 0; log.payCut += c.failPay ?? 0; if (c.failHurt) log.hurt[r.op.id] = log.hurt[r.op.id] ?? 'light'; }
    tally();
    await say(`${fillWho(ok ? c.ok : c.bad, r.op)} ${diceHtml(r, die)}`, ok ? 'good' : 'bad', 1200);
    if (!ok && c.failHurt) await say(`${who(r.op)} is hurt. Light: −2 for the rest of the run.`, 'bad', 800);
    return true;
  };

  // ---- The run itself ----
  let going = true;
  const step = async (res) => {
    if (res === 'stop') going = false;
    else if (res === 'alert') going = await alertCall(team.length ? ZONE_AT[phaseZone] : null);
  };
  let phaseZone = 'fence';
  await newPhase('Way in');
  await say('Pier 12 at midnight. Amber floodlights burn through the salt fog, turning the container stacks into canyons.', 'beat', 1400);
  if (approach === 'con') await say('Hi-vis vests, a clipboard and two borrowed passes: ¥200 well spent, hopefully.', 'why', 900);
  if (over) await say(`${who(over)} climbs the crane with ${kit === 'rifle' ? 'a rifle across their back' : 'a drone case'}. ${kit === 'rifle' ? 'From up there, the whole yard. Not the office.' : 'The drone sees everywhere, for a while.'}`, 'why', 1000);
  for (const z of ZONES) {
    if (!going) break;
    phaseZone = z.id;
    if (z.id !== 'fence') await newPhase(z.name);
    const pathTo = { fence: PATH.slice(0, 2), yard: PATH.slice(1, 4), office: PATH.slice(3) }[z.id];
    for (const pt of pathTo.slice(1)) { moveGroup(pt); await wait(420); }
    const pool = POOLS[z.id][approach];
    const picks = [];
    for (let i = 0; i < COUNT[z.id]; i++) picks.push(pool[Math.floor(rng() * pool.length)]);
    if (z.id === 'yard' && approach !== 'loud' && rng() < OFFBEAT) picks[1] = 'guard';
    for (let i = 0; i < picks.length && going; i++) {
      await step(await incident(picks[i], z.id));
      if (going && z.id === 'yard' && i === 0) going = await crisis(CRISIS_BY_APPROACH[approach]);
    }
    if (going && z.id === 'office') {
      await step(await incident('safe', 'office'));
      if (going) await say('Manifest in hand. Time to leave the way you came.', 'beat', 1100);
    }
  }
  await newPhase('Way out');
  phaseZone = 'yard';
  for (const pt of EXIT_PATHS[plan.exit].slice(1)) { moveGroup(pt); await wait(420); }
  if (going) {
    if (plan.exit === 'van') going = await crisis('boxed', wheels);
    else await say('The Ferryman rows you out under a tarp. He doesn\'t say a word the whole way.', 'beat', 1100);
  }
  await wait(600);
  renderReport(log, { S, kit, approach, over, team });
}

// ---------- Report ----------
function renderReport(log, { S, kit, approach, over, team }) {
  const cut = log.aborted ? 1 : Math.min(1, log.payCut);
  const gross = Math.round((PAY * (1 - cut)) / 50) * 50;
  const fare = plan.exit === 'boat' && !log.aborted ? Math.round((gross * 0.15) / 50) * 50 : 0;
  const cost = APPROACHES[approach].money ?? 0;
  const net = gross - fare - cost;
  const hurt = Object.entries(log.hurt);
  const serious = hurt.filter(([, v]) => v === 'serious').map(([id]) => byId(id).handle);
  const clean = !log.aborted && !log.fails.length && !hurt.length;
  const title = log.aborted ? 'Pulled out' : clean ? 'Clean job' : 'Done, with costs';
  const joss = log.aborted ? (serious.length ? `${serious.join(' and ')} is in a bad way. We got everyone home, and that's the job tonight.` : 'Nobody paid us, but everyone came home.')
    : log.saves.length && !hurt.length ? `Clean on paper. ${log.saves[0].by} pulled ${log.saves[0].who} out of trouble${log.saves.length > 1 ? ', and not just the once' : ''}, so buy them a drink.`
    : serious.length ? `We got the manifest. ${serious.join(' and ')} paid for it. Two weeks, the clinic says.`
    : hurt.length ? 'We got the manifest. A few bruises on the way.'
    : clean ? 'In and out. The Ferryman won\'t even know how close it wasn\'t.' : 'Got it done. Noisier than I\'d like.';
  const checks = [
    ...log.events.map((e) => [e.ok ? 'ok' : 'no', `${e.op} on ${lowerFirst(e.name)}: ${e.ok ? 'passed' : 'failed'} at ${e.risk} risk.`]),
    ...log.saves.map((s) => ['sv', `${s.by} saved ${s.who} (${s.how === 'shot' ? 'a shot from the crane' : s.how === 'drone' ? 'the drone' : 'by hand'}).`]),
    ...(log.rescued ? [['sv', `${log.rescued.by} came in from standby and got ${log.rescued.who} out.`]] : []),
    ...(log.standbyIn && !log.rescued ? [['meh', 'Standby was called in.']] : []),
    ...(log.wentLoud ? [['meh', 'You went loud at max alert.']] : []),
    ['meh', `Alert reached ${log.alert} of 3.`],
    ...Object.entries(log.neural).map(([h, n]) => ['meh', `${h} took ${n} neural load.`]),
    ['meh', log.callIns ? `You were called in ${log.callIns} time${log.callIns > 1 ? 's' : ''}.` : 'The crew never called you in.'],
  ];
  const app = document.getElementById('app');
  app.className = 'wrap no-bar';
  document.getElementById('bar').hidden = true;
  app.innerHTML = `
    <header style="display:grid;gap:6px"><span class="eyebrow">Report · Container 409 · ${APPROACHES[approach].name}</span><h1>${title}</h1></header>
    <p class="joss">${esc(joss)} <span class="muted">— Joss</span></p>
    <div class="facts">
      <div class="fact"><b>${yen(net)}</b><span>Net</span></div>
      <div class="fact"><b>+${log.heat}</b><span>Heat</span></div>
      <div class="fact"><b>${hurt.length}</b><span>Hurt</span></div>
      <div class="fact"><b>${log.saves.length}</b><span>Saves</span></div>
    </div>
    <section><h2>The squad</h2><div class="planline">
      ${INSIDE.filter((s) => S[s]).map((s) => `<span>Inside: ${esc(byId(S[s]).handle)}</span>`).join('')}
      ${S.over ? `<span>Overwatch: ${esc(byId(S.over).handle)} (${kit})</span>` : '<span>No overwatch</span>'}
      ${S.wheels ? `<span>Wheels: ${esc(byId(S.wheels).handle)}</span>` : ''}${S.standby ? `<span>Standby: ${esc(byId(S.standby).handle)}</span>` : ''}
    </div></section>
    <section><h2>What happened</h2><ul class="check">${checks.map(([k, t]) => `<li class="${k}"><i>${k === 'ok' ? '✓' : k === 'no' ? '✗' : k === 'sv' ? '★' : '·'}</i><span>${esc(t)}</span></li>`).join('')}</ul></section>
    <section><h2>Money</h2><div class="money">
      <div><span>Job pays</span><span>${yen(PAY)}</span></div>
      ${gross !== PAY ? `<div><span>${log.aborted ? 'Pulled out' : 'Cuts'}</span><span>${yen(gross - PAY)}</span></div>` : ''}
      ${fare ? `<div><span>Ferryman's fare</span><span>${yen(-fare)}</span></div>` : ''}
      ${cost ? `<div><span>Props and bribes</span><span>${yen(-cost)}</span></div>` : ''}
      <div><span>Net</span><span>${yen(net)}</span></div>
    </div></section>
    <div class="btns"><button class="btn" id="again">Same squad again</button><button class="btn btn--ghost" id="change">Change plan</button></div>
    <p class="seed">Seed ${seed}. "Same squad again" rolls new dice.</p>`;
  document.getElementById('again').addEventListener('click', () => { seed = (seed * 48271) % 2147483647; run(); });
  document.getElementById('change').addEventListener('click', () => { seed = (seed * 48271) % 2147483647; window.scrollTo(0, 0); renderPlan(); });
  window.scrollTo(0, 0);
}

renderPlan();
</script>
