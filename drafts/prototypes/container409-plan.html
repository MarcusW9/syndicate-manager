<style>
/* Layout: one phone-width column. Plan = map, then steps with their risk shown in place, and a sticky
   action bar. Watch = sticky compact map + live tallies over a phased feed. Report = verdict first.
   Deliberately single dark theme: the game's street-terminal skin (src/ui/styles.css). */
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1c2029;
  --line: #262b36;
  --text: #e7e9ee;
  --muted: #8b93a7;
  --accent: #ff4f7b;
  --accent-2: #36d6c3;
  --warn: #f5b942;
  --danger: #ff5a5a;
  --good: #5fe0a5;
  --sel: #13221f;
  --display: 'Rajdhani', 'Arial Narrow', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --tap: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; padding-bottom: 96px; }
.wrap.no-bar { padding-bottom: 24px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.02em; line-height: 1.1; }
h2 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font: 400 0.75rem var(--body); letter-spacing: 0; text-transform: none; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.8rem; }
.eyebrow { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.tag { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; border: 1px dashed var(--muted); color: var(--muted); border-radius: 4px; padding: 1px 6px; }
.brief { color: #c9cdd8; font-style: italic; font-size: 0.92rem; border-left: 2px solid var(--accent); padding-left: 10px; }
details.how { font-size: 0.82rem; color: var(--muted); }
details.how summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; color: var(--accent-2); }
section { display: grid; gap: 8px; }

/* Map */
.map { position: relative; background: #0b0d11; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .route { fill: none; stroke: #2c3240; stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; stroke-linejoin: round; }
.map .route.on { stroke: var(--accent-2); stroke-dasharray: none; }
.map .exit { fill: none; stroke: #2c3240; stroke-width: 2; stroke-dasharray: 4 5; stroke-linejoin: round; }
.map .exit.on { stroke: var(--warn); stroke-dasharray: none; }
.map .hit { fill: none; stroke: transparent; stroke-width: 20; pointer-events: stroke; cursor: pointer; }
.map .node { fill: #171a21; stroke: #3a4254; stroke-width: 1.5; }

.card { width: 100%; text-align: left; display: grid; gap: 4px; min-height: var(--tap); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }

/* Crew: a heist board of pinned dossiers */
.board { position: relative; display: grid; gap: 10px; padding: 14px 12px 12px; border-radius: 12px; border: 1px solid #2a2f3b; background:
  radial-gradient(circle at 20% 10%, rgba(54, 214, 195, 0.06), transparent 40%),

.jossbtn { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #1f4440; background: #10201e; color: var(--accent-2); font: 600 0.88rem var(--display); letter-spacing: 0.04em; cursor: pointer; white-space: nowrap; }
.dossiers { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; }

.dossier__photo svg { width: 100%; height: 100%; display: block; }
.dossier__name { font: 700 1rem var(--display); line-height: 1.05; }
.dossier__real { font-size: 0.66rem; color: #5a5f6c; line-height: 1.1; }
.dossier .pill { font-size: 0.58rem; padding: 0 6px; background: #1b1d22; }
.dossier__stats { width: 100%; display: grid; gap: 3px; padding: 2px 4px 0; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 0 6px; font: 500 0.62rem var(--mono); text-transform: uppercase; color: #4a4f5c; text-align: left; }

.dossier.empty .sil { width: 56px; height: 56px; border-radius: 50%; border: 2px dashed #3a4254; display: grid; place-items: center; font: 600 1.6rem var(--display); color: #4a5266; }

/* Picker sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5, 6, 9, 0.6); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82vh; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(30%); opacity: 0.4; } to { transform: none; opacity: 1; } }

.sheet__in { max-width: 520px; margin: 0 auto; display: grid; gap: 10px; }
.sheet__head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }

.x { min-width: var(--tap); min-height: var(--tap); background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
.cand { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; min-height: 60px; padding: 6px 10px 6px 6px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.cand[aria-pressed="true"] { border-color: var(--accent-2); background: var(--sel); }
.cand__ph { width: 48px; height: 48px; border-radius: 6px; overflow: hidden; background: #0b0d11; }
.cand__ph svg { width: 100%; height: 100%; display: block; }
.cand__txt { display: grid; gap: 1px; min-width: 0; }
.cand__txt b { font: 700 1.02rem var(--display); }
.cand__txt span { font-size: 0.74rem; color: var(--muted); }
.cand__side { display: grid; justify-items: end; gap: 3px; }
.cand__side small { font: 500 0.6rem var(--mono); text-transform: uppercase; color: var(--muted); }

/* Prep */
.prep { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.prepbtn { text-align: left; display: grid; gap: 3px; align-content: start; min-height: var(--tap); padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.prepbtn[aria-pressed="true"] { border-color: var(--warn); background: #211d12; }
.prepbtn b { font-family: var(--display); font-weight: 600; font-size: 0.98rem; display: flex; justify-content: space-between; gap: 6px; }
.prepbtn b span { font-family: var(--mono); font-size: 0.74rem; color: var(--warn); font-weight: 500; }
.prepbtn small { font-size: 0.75rem; color: var(--muted); }
.prepbtn .odds { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase; }

.prepbtn.dim:not([aria-pressed="true"]) { opacity: 0.55; }

/* Orders */
.order { display: grid; gap: 6px; }
.order p { font-size: 0.84rem; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { min-height: 40px; background: transparent; border: 0; border-radius: 7px; font: 600 0.92rem var(--display); letter-spacing: 0.02em; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--accent-2); box-shadow: inset 0 0 0 1px var(--accent-2); }
.order .muted { font-size: 0.76rem; }

/* Sticky action bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(15, 17, 21, 0.96); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar__in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.bar__sum { display: grid; gap: 2px; min-width: 0; }
.bar__sum b { font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.bar__sum span { font-size: 0.74rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { min-height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 700 1.05rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn--ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn--wide { width: 100%; }

/* Watch */
.live { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 4px 8px; display: grid; gap: 6px; }
.live .map svg { height: min(24vh, 190px); }
.tally { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--mono); font-size: 0.72rem; }
.tally span { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.tally .phase { color: var(--accent-2); border-color: #1f4440; }
.tally .bad { color: var(--danger); border-color: #4a2224; }
.feed { display: grid; gap: 6px; }
.feed > * { scroll-margin-bottom: 96px; }
.phasehead { font: 700 0.75rem var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-2); padding-top: 8px; display: flex; gap: 8px; align-items: center; }
.phasehead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.line { padding: 6px 0 6px 12px; border-left: 2px solid var(--line); font-size: 0.92rem; animation: in 0.35s ease-out; }
.line.beat { color: #c9cdd8; font-style: italic; }
.line.check { font-size: 0.84rem; color: #b4bacb; }
.line.check .res { font-family: var(--mono); font-size: 0.72rem; }
.line.good { border-color: var(--good); }
.line.bad { border-color: var(--danger); }
.line.crisis { border-color: var(--accent); background: #1a1418; border-radius: 0 8px 8px 0; padding: 8px 10px 8px 12px; font-weight: 500; }
.line.why { font-size: 0.82rem; color: var(--muted); }
.who { font-family: var(--display); font-weight: 700; letter-spacing: 0.02em; }
.dice { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); background: none; border: 0; padding: 0 0 0 4px; cursor: pointer; text-decoration: underline dotted; min-height: 24px; }
.dice-detail { display: block; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
@keyframes in { from { opacity: 0.2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .line { animation: none; } }
.callin { border: 1px solid var(--accent); background: #1d1418; border-radius: 12px; padding: 12px; display: grid; gap: 8px; animation: in 0.35s ease-out; }
.callin__q { font-size: 0.95rem; }
.callin .eyebrow { color: var(--accent); }
.choice { min-height: var(--tap); text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; cursor: pointer; display: grid; gap: 3px; }
.choice:hover:not(:disabled) { border-color: var(--accent-2); }
.choice:disabled { cursor: default; opacity: 0.5; }
.choice.picked { opacity: 1; border-color: var(--accent-2); }
.choice__top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.choice__top > span:first-child { min-width: 0; }
.choice__sub { font-size: 0.75rem; color: var(--muted); }
.crewpick { font-family: var(--mono); font-size: 0.6rem; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.06em; }

/* Report */
.verdict { display: grid; gap: 10px; }

.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }

.planline { display: flex; flex-wrap: wrap; gap: 6px; }
.planline span { font-family: var(--mono); font-size: 0.7rem; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: #b4bacb; }

<script>
// ---------- Rules (the game's own: success if d20 + stat >= 10 + difficulty) ----------
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const chanceOf = (stat, diff) => Math.min(0.95, Math.max(0.05, (21 - (10 + diff - stat)) / 20));
const riskOf = (c) => (c >= 0.75 ? 'low' : c >= 0.5 ? 'moderate' : c >= 0.3 ? 'high' : 'extreme');
const RISK_ORDER = ['safe', 'low', 'moderate', 'high', 'extreme'];
const worst = (list) => list.reduce((a, b) => (RISK_ORDER.indexOf(b) > RISK_ORDER.indexOf(a) ? b : a), 'safe');
const yen = (n) => (n < 0 ? '-¥' : '¥') + Math.abs(Math.round(n)).toLocaleString();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
const pill = (risk) => `<span class="pill r-${risk}">${risk}</span>`;

// ---------- The crew: five founding rookies (main stat 10-11, the game's founder band) ----------
const CREW = [
  { id: 'eggtart', handle: 'Egg Tart', name: 'Ivy Chan', role: 'tech', color: '#36d6c3', stats: { combat: 4, stealth: 7, tech: 11, social: 5, driving: 4, medical: 3, cool: 7 } },
  { id: 'hotwire', handle: 'Hotwire', name: 'Paolo Reyes', role: 'driver', color: '#f5b942', stats: { combat: 5, stealth: 6, tech: 6, social: 4, driving: 11, medical: 2, cool: 8 } },
  { id: 'kit', handle: 'Kit', name: 'Winnie Lau', role: 'face', color: '#ff4f7b', stats: { combat: 3, stealth: 6, tech: 3, social: 10, driving: 4, medical: 4, cool: 8 } },
  { id: 'rat', handle: 'Rat', name: 'Tunde Okoro', role: 'muscle', color: '#9d8cff', stats: { combat: 10, stealth: 8, tech: 3, social: 4, driving: 5, medical: 2, cool: 6 } },
  { id: 'mop', handle: 'Mop', name: 'Kelvin Cheung', role: 'medic', color: '#5fe0a5', stats: { combat: 3, stealth: 5, tech: 5, social: 7, driving: 3, medical: 10, cool: 9 } },
];

  return `<svg viewBox="0 0 360 260" role="img" aria-label="Map of Pier 12: three ways in to Stack 409, two ways out">

    <circle class="node" cx="${P.seawall[0]}" cy="${P.seawall[1]}" r="5"/>${lbl(P.seawall, 'SEAWALL', 9, 3, plan.route === 'seawall')}

function drawTokens(list) {
  const g = document.getElementById('tokens');
  g.innerHTML = list.map(({ op, at }, i) => `<g class="token" id="tok-${op.id}" style="transform: translate(${at[0] + i * 10 - 10}px, ${at[1] - 13}px)"><circle r="8.5" fill="${op.color}"/><text>${esc(initials(op))}</text></g>`).join('');
}
function moveToken(op, i, at) {
  const t = document.getElementById(`tok-${op.id}`);
  if (t) t.style.transform = `translate(${at[0] + i * 10 - 10}px, ${at[1] - 13}px)`;
}
function alarm(at) {

  a.setAttribute('cx', at[0]); a.setAttribute('cy', at[1]); a.classList.add('on');
}

// ---------- Plan state and the shared odds (the read and the run use the same numbers) ----------
const plan = { route: 'seawall', exit: 'van', point: null, watch: null, wheels: null, prep: new Set(), callIn: 'risky', ifHurt: 'out' };
let seed = (Date.now() % 2147483647) | 0;
const slotsNeeded = () => (plan.exit === 'van' ? ['point', 'watch', 'wheels'] : ['point', 'watch']);
const fill = (t, op) => t.replaceAll('{op}', op.handle);

// Point handles the way in, Watch the post, Wheels the road out. The other person walking in
// backs them up (+1 if they have 7+ in the stat), as in the game.
function rollFor(slotId, choice, who = plan) {
  const op = byId(who[slotId]);
  const partnerId = slotId === 'point' ? who.watch : slotId === 'watch' ? who.point : null;
  const partner = partnerId ? byId(partnerId) : null;
  let value = op.stats[choice.stat];
  const notes = [`${choice.stat} ${op.stats[choice.stat]}`];
  if (slotId === 'point' && ROUTES[who.route].bonus === choice.stat) { value += 1; notes.push('route +1'); }
  if (partner && partner.id !== op.id && partner.stats[choice.stat] >= 7) { value += 1; notes.push(`${partner.handle} backs up +1`); }
  let diff = choice.diff;
  for (const p of PREP) if (who.prep.has(p.id) && p.mods[choice.id]) { diff -= p.mods[choice.id]; notes.push(`${lowerFirst(p.name)} −${p.mods[choice.id]}`); }
  const chance = chanceOf(value, diff);
  return { op, value, diff, need: 10 + diff, chance, risk: riskOf(chance), notes };
}
function available(choice, slotId, who = plan) {
  if (!choice.needs) return true;
  if (choice.needs.prep && who.prep.has(choice.needs.prep)) return true;
  return byId(who[slotId]).stats[choice.needs.stat] >= choice.needs.min;
}
// The crew's own call: the best odds; on a tie, the option that costs nothing.
function crewPick(crisisId, slotId, who = plan) {
  return C[crisisId].choices.filter((c) => available(c, slotId, who)).map((c) => ({ c, r: rollFor(slotId, c, who) }))
    .sort((a, b) => b.r.chance - a.r.chance || (a.c.payCut ?? 0) - (b.c.payCut ?? 0));
}
// What a slot faces under a plan: its crises and the worst best-option risk among them.
function slotRisk(slotId, who = plan) {
  if (!who[slotId]) return null;
  const crises = slotId === 'point' ? [ROUTES[who.route].crisis] : slotId === 'watch' ? POST_CRISES : who.exit === 'van' ? ['boxed'] : [];
  return worst(crises.map((cid) => crewPick(cid, slotId, who)[0].r.risk));
}
// The stats each slot leans on under this plan (shown on the dossier).
const slotStats = (slotId, who = plan) => {
  const crises = slotId === 'point' ? [ROUTES[who.route].crisis] : slotId === 'watch' ? POST_CRISES : ['boxed'];
  return [...new Set(crises.flatMap((cid) => C[cid].choices.map((c) => c.stat)))].slice(0, 3);
};
// Joss's picks: fill the slots in order, each with the free person who faces the least risk there.
function jossPicks() {
  const who = { ...plan, point: null, watch: null, wheels: null };
  const order = slotsNeeded();
  const best = {};
  for (const s of order) {
    const free = CREW.filter((o) => !order.some((t) => who[t] === o.id));
    free.sort((a, b) => RISK_ORDER.indexOf(slotRisk(s, { ...who, [s]: a.id })) - RISK_ORDER.indexOf(slotRisk(s, { ...who, [s]: b.id }))
      || slotStats(s, who).reduce((n, st) => n + b.stats[st] - a.stats[st], 0));
    who[s] = free[0].id;
    best[s] = free[0].id;
  }
  return best;
}
const withPlan = (changes) => ({ ...plan, prep: plan.prep, ...changes });
const prepOdds = (p) => (p.helps === ROUTES[plan.route].crisis || (p.helps === 'boxed' && plan.exit === 'van') ? 'will' : POST_CRISES.includes(p.helps) ? 'might' : 'wont');
const prepCost = () => [...plan.prep].reduce((n, id) => n + PREP.find((p) => p.id === id).cost, 0);

// ---------- Planning screen ----------
function renderPlan() {
  const app = document.getElementById('app');
  app.className = 'wrap';
  const fare = plan.exit === 'boat' ? PAY * 0.15 : 0;
  const routeCard = (k, r) => {

  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-order="${key}" data-v="${v}" aria-pressed="${plan[key] === v}">${l}</button>`).join('')}</div>`;

  app.innerHTML = `
    <header style="display:grid;gap:8px">

      <p class="brief">"An off-manifest crate on the gantry. Keep your eyes open, keep your mouths shut, and don't whistle."</p>
      <details class="how"><summary>How this prototype works</summary><p>Plan the job, then watch it play out. The crew make their own calls and only call you in when your orders say so. Same roll rule and crises as the game; the map, slots and prep are new. Every risk shown here is the one the run uses.</p></details>
    </header>
    <div class="map">${mapSvg(plan, { interactive: true })}<span class="map__hint">Tap a route</span></div>

        <p class="muted">${plan.callIn === 'every' ? 'You make every call.' : plan.callIn === 'risky' ? 'They call you when their best option is high risk or worse.' : 'They decide everything, and pull out if every option is extreme.'}</p></div>
      <div class="order"><p>If someone gets hurt…</p>${seg('ifHurt', [['out', 'Get them out'], ['finish', 'Finish the job']])}</div>
    </section>`;

  bar.innerHTML = `<div class="bar__in"><div class="bar__sum"><b>${yen(PAY - fare - prepCost())}</b><span>${missing.length ? `Still to assign: ${missing.map((s) => SLOTS[s].name).join(', ')}` : `if it runs clean · toughest moment ${pill(toughest)}`}</span></div><button class="btn" id="go" ${missing.length ? 'disabled' : ''}>Send them</button></div>`;

  app.querySelectorAll('[data-route]').forEach((el) => el.addEventListener('click', () => { plan.route = el.dataset.route; rerender(el); }));
  app.querySelectorAll('[data-exit]').forEach((el) => el.addEventListener('click', () => { plan.exit = el.dataset.exit; fixSlots(); rerender(el); }));
  app.querySelectorAll('[data-prep]').forEach((el) => el.addEventListener('click', () => { const id = el.dataset.prep; plan.prep.has(id) ? plan.prep.delete(id) : plan.prep.add(id); rerender(el); }));

  document.getElementById('joss').addEventListener('click', () => { Object.assign(plan, jossPicks()); rerender(document.getElementById('joss')); });
  app.querySelectorAll('[data-order]').forEach((el) => el.addEventListener('click', () => { plan[el.dataset.order] = el.dataset.v; rerender(el); }));

// Re-render and keep focus on the same control (keyboard users keep their place).
function rerender(el) {
  const sel = el.id === 'joss' ? '#joss' : el.dataset.dossier ? `[data-dossier="${el.dataset.dossier}"]` : el.dataset.route ? `.card[data-route="${el.dataset.route}"]` : el.dataset.exit ? `.card[data-exit="${el.dataset.exit}"]` : el.dataset.prep ? `[data-prep="${el.dataset.prep}"]` : el.dataset.op ? `.chip[data-slot="${el.dataset.slot}"][data-op="${el.dataset.op}"]` : `[data-order="${el.dataset.order}"][data-v="${el.dataset.v}"]`;
  const hadFocus = document.activeElement === el;
  const y = window.scrollY;
  renderPlan();
  window.scrollTo(0, y);
  if (hadFocus) document.querySelector(sel)?.focus({ preventScroll: true });
}
// Put someone in a slot; if they're already in another slot, the two swap.
function swapIn(slotId, opId) {
  const from = slotsNeeded().find((s) => s !== slotId && plan[s] === opId);
  return from ? { [slotId]: opId, [from]: plan[slotId] } : { [slotId]: opId };
}
function fixSlots() {
  // Leaving the van frees Wheels; coming back, Wheels starts empty unless they're still free.
  if (plan.exit !== 'van') return;
  if (plan.wheels && (plan.wheels === plan.point || plan.wheels === plan.watch)) plan.wheels = null;
}

// The picker: a sheet listing the crew, best fit first, each with their risk in this slot.
function openPicker(slotId) {
  const sl = SLOTS[slotId];
  const rows = CREW.map((o) => ({ o, risk: slotRisk(slotId, withPlan(swapIn(slotId, o.id))), where: slotsNeeded().find((s) => s !== slotId && plan[s] === o.id) }))
    .sort((a, b) => RISK_ORDER.indexOf(a.risk) - RISK_ORDER.indexOf(b.risk) || slotStats(slotId).reduce((n, st) => n + b.o.stats[st] - a.o.stats[st], 0));
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet'; sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-label', `Who's on ${sl.name}?`);
  sheet.innerHTML = `<div class="sheet__in">
    <div class="sheet__head"><div><h3>Who's on ${sl.name}?</h3><p>${sl.does} Leans on ${slotStats(slotId).join(', ')}.</p></div><button type="button" class="x" aria-label="Close">✕</button></div>
    ${rows.map(({ o, risk, where }) => `<button type="button" class="cand" data-op="${o.id}" aria-pressed="${plan[slotId] === o.id}">
      <span class="cand__ph">${face(o)}</span>
      <span class="cand__txt"><b>${esc(o.handle)}</b><span>${o.role} · ${slotStats(slotId).map((st) => `${st} ${o.stats[st]}`).join(' · ')}</span></span>
      <span class="cand__side">${pill(risk)}${where ? `<small>on ${SLOTS[where].name} · swaps</small>` : plan[slotId] === o.id ? '<small>assigned</small>' : ''}</span></button>`).join('')}
  </div>`;
  document.body.append(scrim, sheet);
  const close = (focusBack = true) => { scrim.remove(); sheet.remove(); document.removeEventListener('keydown', onKey); if (focusBack) document.querySelector(`[data-dossier="${slotId}"]`)?.focus({ preventScroll: true }); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  scrim.addEventListener('click', () => close());
  sheet.querySelector('.x').addEventListener('click', () => close());
  sheet.querySelectorAll('.cand').forEach((b) => b.addEventListener('click', () => {
    Object.assign(plan, swapIn(slotId, b.dataset.op));
    close(false);
    rerender(document.querySelector(`[data-dossier="${slotId}"]`));
    document.querySelector(`[data-dossier="${slotId}"]`)?.focus({ preventScroll: true });
  }));
  (sheet.querySelector('.cand[aria-pressed="true"]') ?? sheet.querySelector('.cand')).focus({ preventScroll: true });
}

// ---------- The run: a phased feed, tokens on the map, call-ins ----------
let fast = false;
const wait = (ms) => new Promise((r) => setTimeout(r, fast ? 50 : ms));

async function run() {
  const rng = mulberry32(seed);
  const d20 = () => 1 + Math.floor(rng() * 20);
  const walkers = ['point', 'watch'].map((s) => byId(plan[s]));
  const wheels = plan.exit === 'van' ? byId(plan.wheels) : null;
  const log = { heat: 0, payCut: 0, payBonus: 0, hurt: [], aborted: false, pulledOut: false, callIns: 0, met: [], used: new Set(), postDone: false, events: [] };
  fast = false;
  window.scrollTo(0, 0);

  const app = document.getElementById('app');
  app.className = 'wrap';
  app.innerHTML = `
    <div class="live"><div class="map">${mapSvg(plan)}</div><div class="tally" id="tally"></div></div>
    <div class="feed" id="feed" aria-live="polite"></div>`;
  drawTokens(walkers.map((op) => ({ op, at: P.drop })).concat(wheels ? [{ op: wheels, at: P.drop }] : []));
  const bar = document.getElementById('bar');
  bar.hidden = false;
  bar.innerHTML = `<div class="bar__in"><div class="bar__sum"><b>Live</b><span>${esc(walkers.map((o) => o.handle).join(' & '))}${wheels ? ` · ${esc(wheels.handle)} driving` : ''}</span></div><button class="btn btn--ghost" id="skip">Speed up</button></div>`;
  document.getElementById('skip').addEventListener('click', (e) => { fast = !fast; e.target.textContent = fast ? 'Normal speed' : 'Speed up'; });

  let phase = 'Way in';
  const tally = () => {
    document.getElementById('tally').innerHTML = `<span class="phase">${phase}</span><span class="${log.heat ? 'bad' : ''}">Heat +${log.heat}</span><span class="${log.hurt.length ? 'bad' : ''}">Hurt ${log.hurt.length}</span>${log.callIns ? `<span>Calls ${log.callIns}</span>` : ''}`;
  };
  tally();
  const feed = document.getElementById('feed');
  const add = (node) => { feed.appendChild(node); node.scrollIntoView({ block: 'end', behavior: fast ? 'auto' : 'smooth' }); };
  const say = async (html, cls = '', ms = 1100) => {
    const div = document.createElement('div');
    div.className = `line ${cls}`;
    div.innerHTML = html;
    div.querySelectorAll('.dice').forEach((b) => b.addEventListener('click', () => { const d = b.nextElementSibling; d.hidden = !d.hidden; b.setAttribute('aria-expanded', String(!d.hidden)); }));
    add(div);
    await wait(ms);
  };
  const newPhase = async (name) => {
    phase = name; tally();
    const h = document.createElement('div'); h.className = 'phasehead'; h.textContent = name; add(h);
    await wait(400);
  };
  const who = (op) => `<span class="who" style="color:${op.color}">${esc(op.handle)}</span>`;
  const fillWho = (t, op) => esc(t).replaceAll('{op}', who(op));
  const diceHtml = (r, die) => `<button class="dice" type="button" aria-expanded="false">${die + r.value >= r.need ? '✓' : '✗'} dice</button><span class="dice-detail" hidden>die ${die} + ${r.value} (${esc(r.notes.join(', '))}) = ${die + r.value} · needs ${r.need}</span>`;
  const walk = async (path, ops) => { for (const pt of path.slice(1)) { ops.forEach((op, i) => moveToken(op, i, pt)); await wait(450); } };
  const smallCheck = async (chk, op, stat) => {
    const die = d20();
    const ok = die + op.stats[stat] >= 10 + chk.diff;
    await say(`${fillWho(ok ? chk.ok : chk.bad, op)} <span class="res muted">${stat} ${ok ? '✓' : '✗'}</span>`, 'check', 1000);
  };

  // One crisis: the crew decides under the orders, or calls you in. Returns false if the job stops here.
  const crisis = async (cid, slotId, at) => {
    const cr = C[cid];
    const op = byId(plan[slotId]);
    log.met.push(cid);
    for (const p of PREP) if (p.helps === cid && plan.prep.has(p.id)) log.used.add(p.id);
    alarm(at);
    await say(esc(cr.text), 'crisis', 1400);
    const opts = crewPick(cid, slotId);
    const best = opts[0];
    let picked;
    if (plan.callIn === 'every' || (plan.callIn === 'risky' && best.r.chance < 0.5)) {
      log.callIns++; tally();
      picked = await callIn(cr, opts, op);
    } else if (plan.callIn === 'never' && best.r.chance < 0.3) {
      picked = { abort: true };
      await say(`${who(op)} doesn't like any of it. Under your orders, they pull out.`, 'why', 900);
    } else {
      picked = best;
      await say(`${who(op)}'s call: ${fillWho(lowerFirst(best.c.label), op)}. The best odds they had (${best.r.risk}).`, 'why', 900);
    }
    alarm(null);
    if (picked.abort) {
      log.aborted = true;
      log.payCut = cr.abort.payCut != null && log.postDone ? cr.abort.payCut : 1;
      log.events.push({ cid, abort: true });
      await say(esc(cr.abort.ok), 'bad', 1100);
      return false;
    }
    const { c, r } = picked;
    const die = d20();
    const ok = die + r.value >= r.need;
    if (c.payCut) log.payCut += c.payCut;
    if (ok && c.payBonus) log.payBonus += c.payBonus;
    if (!ok) { log.heat += c.failHeat ?? 0; log.payCut += c.failPay ?? 0; if (c.failHurt) log.hurt.push(op.handle); }
    if (c.id === 'tidewatch' && plan.prep.has('tide') && op.stats.cool < 10) log.used.add('tide');
    log.events.push({ cid, c, op, ok, die, r });
    tally();
    await say(`${fillWho(ok ? c.ok : c.bad, op)} ${diceHtml(r, die)}`, ok ? 'good' : 'bad', 1300);
    if (!ok && c.failHeat) await say(`Heat +${c.failHeat}.`, 'check', 700);
    if (!ok && c.failHurt) {
      await say(`${who(op)} is hurt. Light: they can walk.`, 'bad', 900);
      if (plan.ifHurt === 'out') {
        log.pulledOut = true;
        await say(`Your orders: get them out. The crew pulls back${log.postDone ? '. The crate is already off the gantry' : ' before the drop'}.`, 'why', 1100);
        return false;
      }
      await say('Your orders: finish the job. They keep going.', 'why', 900);
    }
    return true;
  };

  // A call-in: the feed waits for you. Every call-in has an exit.
  const callIn = (cr, opts, op) => new Promise((resolve) => {
    const box = document.createElement('div');
    box.className = 'callin';
    box.innerHTML = `<span class="eyebrow">${esc(op.handle)} is calling in</span>
      <p class="callin__q">"${esc(cr.name)}. What do we do?"</p>
      ${opts.map((o, i) => `<button class="choice" data-i="${i}"><span class="choice__top"><span>${fillWho(o.c.label, op)}</span>${pill(o.r.risk)}</span><span class="choice__sub">${i === 0 ? '<span class="crewpick">Crew\'s pick · </span>' : ''}${esc(o.r.notes.join(', '))}${o.c.payCut ? ` · pay −${o.c.payCut * 100}%` : ''}${o.c.failHurt ? ' · can hurt' : ''}${o.c.failHeat ? ' · heat if it fails' : ''}</span></button>`).join('')}
      <button class="choice" data-i="abort"><span class="choice__top"><span>${esc(cr.abort.label)}</span>${pill('certain')}</span><span class="choice__sub">Nobody's hurt. You lose the pay.</span></button>`;
    add(box);
    box.querySelector('button').focus({ preventScroll: true });
    box.querySelectorAll('button.choice').forEach((b) => b.addEventListener('click', () => {
      box.querySelectorAll('button').forEach((x) => { x.disabled = true; });
      b.classList.add('picked');
      resolve(b.dataset.i === 'abort' ? { abort: true } : opts[Number(b.dataset.i)]);
    }));
  });

  // Way in
  await newPhase('Way in');
  await say('Pier 12 at midnight. Amber floodlights burn through the salt fog, turning the container stacks into canyons.', 'beat', 1500);
  if (wheels) await say(`${who(wheels)} parks the van on the service road with the lights off.`, 'check', 900);
  const route = ROUTES[plan.route];
  const path = PATHS[plan.route];
  await walk(path.slice(0, 3), walkers);
  await smallCheck(route.check, byId(plan.point), route.check.stat);
  let going = await crisis(route.crisis, 'point', path[2]);

  // The post
  if (going) {
    await walk(path.slice(2), walkers);
    await newPhase('At the post');
    await say('Cranes screech overhead and diesel fumes roll across the wet tarmac. Nobody whistles.', 'beat', 1300);
    await smallCheck({ diff: 2, ok: '{op} settles in at the corner of Stack 409 with a clear view of the gantry.', bad: '{op} can\'t settle; keeps checking over a shoulder.' }, byId(plan.watch), 'cool');
    const postCrisis = POST_CRISES[Math.floor(rng() * POST_CRISES.length)];
    going = await crisis(postCrisis, 'watch', P.post);
    if (going) { log.postDone = true; await say('The crate comes down off the gantry and into the Ferryman\'s boat.', 'beat', 1300); }
  }

  // Way out (always walked, even after a pull-out)
  await newPhase('Way out');
  if (plan.exit === 'van') {
    await walk(EXIT_PATHS.van, walkers);
    if (going) going = await crisis('boxed', 'wheels', P.drop);
  } else {
    await walk(EXIT_PATHS.boat, walkers);
    if (going) await say('The Ferryman rows you out with the crate under a tarp. He doesn\'t say a word the whole way.', 'beat', 1200);
  }
  if (log.pulledOut) log.payCut = log.postDone ? Math.max(log.payCut, 0.5) : 1;
  await wait(700);
  renderReport(log);
}

// ---------- Report: verdict first, then whether the plan was right ----------
function renderReport(log) {
  const cut = Math.min(1, log.payCut - log.payBonus);
  const gross = Math.round((PAY * (1 - cut)) / 50) * 50;
  const fare = plan.exit === 'boat' && !log.aborted ? Math.round((gross * 0.15) / 50) * 50 : 0;
  const net = gross - fare - prepCost();
  const clean = !log.aborted && !log.pulledOut && !log.heat && !log.hurt.length;
  const title = clean ? 'Clean job' : log.aborted ? 'Aborted' : log.pulledOut ? 'Pulled out' : 'Done, with costs';
  const joss = log.aborted ? 'Nobody hurt, nobody paid. Some nights are like that.'
    : log.pulledOut ? `${log.hurt[0]} is hurt, and you pulled them out like you said you would. ${log.postDone ? 'The Ferryman paid half.' : 'No pay tonight.'}`
    : log.hurt.length ? `We got paid. ${log.hurt.join(' and ')} got hurt doing it. Light, they'll live.`
    : log.heat ? 'We got paid. We also got noticed.'
    : 'Clean. The Ferryman paid and didn\'t even count it.';

  const checks = [];
  for (const e of log.events) {
    if (e.abort) checks.push(['no', `${C[e.cid].name}: you pulled out.`]);
    else checks.push([e.ok ? 'ok' : 'no', `${e.op.handle} on ${lowerFirst(C[e.cid].name)}: ${e.ok ? 'passed' : 'failed'} at ${e.r.risk} risk.`]);
  }
  for (const p of PREP.filter((x) => plan.prep.has(x.id))) {
    checks.push(log.used.has(p.id) ? ['ok', `${p.name} came into play.`] : ['meh', `${p.name} never came up (${yen(-p.cost)}).`]);
  }
  checks.push(['meh', log.callIns ? `You were called in ${log.callIns} time${log.callIns > 1 ? 's' : ''}.` : 'The crew never called you in.']);
  if (log.pulledOut) checks.push(['meh', 'Your "get them out" order was used.']);

  const app = document.getElementById('app');
  app.className = 'wrap no-bar';
  document.getElementById('bar').hidden = true;
  app.innerHTML = `
    <header style="display:grid;gap:6px"><span class="eyebrow">Report · Container 409</span><h1>${title}</h1></header>
    <div class="verdict">
      <p class="joss">${esc(joss)} <span class="muted">— Joss</span></p>
      <div class="facts">
        <div class="fact"><b>${yen(net)}</b><span>Net</span></div>
        <div class="fact"><b>+${log.heat}</b><span>Heat</span></div>
        <div class="fact"><b>${log.hurt.length}</b><span>Hurt</span></div>
      </div>
    </div>
    <section><h2>The plan</h2><div class="planline">
      <span>${esc(ROUTES[plan.route].name)}</span><span>${esc(EXITS[plan.exit].name)}</span>
      ${slotsNeeded().map((s) => `<span>${SLOTS[s].name}: ${esc(byId(plan[s]).handle)}</span>`).join('')}
      <span>Calls: ${{ every: 'every time', risky: 'if risky', never: 'never' }[plan.callIn]}</span>
    </div></section>
    <section><h2>Did it work?</h2><ul class="check">${checks.map(([k, t]) => `<li class="${k}"><i>${k === 'ok' ? '✓' : k === 'no' ? '✗' : '·'}</i><span>${esc(t)}</span></li>`).join('')}</ul></section>
    <section><h2>Money</h2><div class="money">
      <div><span>Job pays</span><span>${yen(PAY)}</span></div>
      ${gross !== PAY ? `<div><span>Cuts and bonuses</span><span>${yen(gross - PAY)}</span></div>` : ''}
      ${fare ? `<div><span>Ferryman's fare</span><span>${yen(-fare)}</span></div>` : ''}
      ${prepCost() ? `<div><span>Prep</span><span>${yen(-prepCost())}</span></div>` : ''}
      <div><span>Net</span><span>${yen(net)}</span></div>
    </div></section>
    <div class="btns">
      <button class="btn" id="again">Same plan again</button>
      <button class="btn btn--ghost" id="change">Change plan</button>
    </div>
    <p class="seed">Seed ${seed}. "Same plan again" rolls new dice.</p>`;
  document.getElementById('again').addEventListener('click', () => { seed = (seed * 48271) % 2147483647; run(); });
  document.getElementById('change').addEventListener('click', () => { seed = (seed * 48271) % 2147483647; window.scrollTo(0, 0); renderPlan(); });
  window.scrollTo(0, 0);
}

renderPlan();
</script>
