<title>Container 409 Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column (plan, then watch, then report), the game's street-terminal skin.
   A deliberately single dark theme, matching the game (src/ui/styles.css). */
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --line: #262b36;
  --text: #e7e9ee;
  --muted: #8b93a7;
  --accent: #ff4f7b;
  --accent-2: #36d6c3;
  --warn: #f5b942;
  --danger: #ff5a5a;
  --good: #5fe0a5;
  --display: 'Rajdhani', 'Arial Narrow', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --tap: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: 0.02em; }
h2 { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); }
.brief { border-left: 2px solid var(--accent); padding-left: 12px; font-style: italic; color: #c9cdd8; }
.proto { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; color: var(--muted); }
section { display: grid; gap: 10px; }

/* Map */
.map { background: #0b0d11; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .route { fill: none; stroke: #2c3240; stroke-width: 3; stroke-dasharray: 2 6; stroke-linecap: round; }
.map .route.on { stroke: var(--accent-2); stroke-dasharray: none; }
.map .exit { fill: none; stroke: #2c3240; stroke-width: 2; stroke-dasharray: 4 5; }
.map .exit.on { stroke: var(--warn); stroke-dasharray: none; }
.map .node { fill: #171a21; stroke: #3a4254; stroke-width: 1.5; }
.map .node.post { stroke: var(--accent); }
.map .label { fill: var(--muted); font-family: var(--mono); font-size: 9px; }
.map .label.hi { fill: var(--text); }
.map .token circle { stroke: var(--bg); stroke-width: 2; }
.map .token text { fill: var(--bg); font-family: var(--display); font-weight: 700; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
.map .token { transition: transform 0.9s ease-in-out; }
.map .water { fill: #0d1620; }
.map .stack { fill: #141821; stroke: #232937; }
@media (prefers-reduced-motion: reduce) { .map .token { transition: none; } }

/* Option cards */
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start; min-height: var(--tap); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.opt input { margin: 3px 0 0; accent-color: var(--accent); width: 18px; height: 18px; grid-row: span 2; }
.opt b { font-family: var(--display); font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }
.opt > span { grid-column: 2; font-size: 0.82rem; color: var(--muted); }
.opt:has(input:checked) { border-color: var(--accent-2); background: #152024; }
.cost { font-family: var(--mono); font-size: 0.8rem; color: var(--warn); }

/* Slots */
.slot { display: grid; gap: 4px; }
.slot label { font-family: var(--display); font-weight: 600; font-size: 1rem; }
.slot .why { font-size: 0.8rem; color: var(--muted); }
select { min-height: var(--tap); width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
.seg button { min-height: var(--tap); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: 600 0.95rem var(--display); letter-spacing: 0.02em; cursor: pointer; padding: 4px 8px; }
.seg button[aria-pressed="true"] { border-color: var(--accent-2); background: #152024; color: var(--accent-2); }

/* Risk read */
.read { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.read__row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
.read__row > div { min-width: 0; }
.read__row .small { display: block; }
.pill { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.r-low { color: var(--good); } .r-moderate { color: var(--accent-2); } .r-high { color: var(--warn); } .r-extreme { color: var(--danger); } .r-certain { color: var(--muted); }
.net { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 8px; }

.btn { min-height: 48px; width: 100%; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 700 1.1rem var(--display); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn--ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Feed */
.feed { display: grid; gap: 8px; }
.line { padding: 8px 0 8px 12px; border-left: 2px solid var(--line); font-size: 0.92rem; animation: in 0.35s ease-out; }
.line.beat { color: #c9cdd8; font-style: italic; }
.line.check { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.line.good { border-color: var(--good); }
.line.bad { border-color: var(--danger); }
.line.crisis { border-color: var(--accent); font-weight: 500; }
.line.why { font-size: 0.82rem; color: var(--muted); }
.dice { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); background: none; border: 0; padding: 0 0 0 4px; cursor: pointer; text-decoration: underline dotted; }
.dice-detail { display: block; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
@keyframes in { from { opacity: 0.2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .line { animation: none; } }
.callin { border: 1px solid var(--accent); background: #1d1418; border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.callin .eyebrow { color: var(--accent); }
.choice { min-height: var(--tap); text-align: left; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer; display: grid; gap: 2px; }
.choice:hover { border-color: var(--accent-2); }
.choice .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.choice .top > span:first-child { min-width: 0; }
.choice .sub { font-size: 0.78rem; color: var(--muted); }
.choice.rec { border-color: #3a4254; }
.sticky { position: sticky; bottom: max(8px, env(safe-area-inset-bottom, 0px)); }

/* Report */
.report { display: grid; gap: 14px; }
.joss { font-size: 1.05rem; border-left: 2px solid var(--accent-2); padding-left: 12px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
.fact b { font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
ul.check { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.check li { padding-left: 18px; position: relative; font-size: 0.9rem; }
ul.check li::before { content: '›'; position: absolute; left: 4px; color: var(--accent-2); }
.money { font-family: var(--mono); font-size: 0.82rem; display: grid; gap: 2px; }
.money div { display: flex; justify-content: space-between; gap: 8px; }
.money div:last-child { border-top: 1px solid var(--line); padding-top: 4px; color: var(--text); font-weight: 500; }
.seed { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); text-align: center; }
</style>

<div class="wrap" id="app"></div>

<script>
// ---------- Rules (the game's own: success if d20 + stat >= 10 + difficulty) ----------
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const chanceOf = (stat, diff) => Math.min(0.95, Math.max(0.05, (21 - (10 + diff - stat)) / 20));
const riskOf = (c) => (c >= 0.75 ? 'low' : c >= 0.5 ? 'moderate' : c >= 0.3 ? 'high' : 'extreme');
const yen = (n) => (n < 0 ? '-¥' : '¥') + Math.abs(Math.round(n)).toLocaleString();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- The crew: five founding rookies (main stat 10-11, the game's founder band) ----------
const CREW = [
  { id: 'eggtart', handle: 'Egg Tart', role: 'tech', stats: { combat: 4, stealth: 7, tech: 11, social: 5, driving: 4, medical: 3, cool: 7 } },
  { id: 'hotwire', handle: 'Hotwire', role: 'driver', stats: { combat: 5, stealth: 6, tech: 6, social: 4, driving: 11, medical: 2, cool: 8 } },
  { id: 'kit', handle: 'Kit', role: 'face', stats: { combat: 3, stealth: 6, tech: 3, social: 10, driving: 4, medical: 4, cool: 8 } },
  { id: 'rat', handle: 'Rat', role: 'muscle', stats: { combat: 10, stealth: 8, tech: 3, social: 4, driving: 5, medical: 2, cool: 6 } },
  { id: 'mop', handle: 'Mop', role: 'medic', stats: { combat: 3, stealth: 5, tech: 5, social: 7, driving: 3, medical: 10, cool: 9 } },
];
const byId = (id) => CREW.find((o) => o.id === id);
const MAIN = { tech: 'tech', driver: 'driving', face: 'social', muscle: 'combat', medic: 'medical' };

// ---------- Container 409: the owner's crises (src/data/missions/container.js), placed on a map ----------
const C = {
  cutter: { name: 'Police boat', text: 'A Wet Sleeve cutter cuts its engine and drifts blind through the fog towards your stack.', choices: [
    { id: 'shadow', label: '{op} melts into the shadow of a container wall', stat: 'stealth', diff: 6, ok: 'The spotlight sweeps the steel a hand above your heads, and moves on.', bad: 'A loose strap clinks against the steel. The light snaps back and holds on {op}.', failHeat: 1 },
    { id: 'splash', label: 'Throw an iron coupler into the water to draw them off', stat: 'cool', diff: 5, ok: 'A heavy splash off the far pylon. The cutter throttles up towards the noise.', bad: 'It clangs off a beam before it hits the water, and points them straight at you.', failHurt: true },
  ], abort: { label: 'Abort: up the gantry ladder and away', ok: 'You vanish up into the fog among the crane girders.' } },
  whistler: { name: 'Night-shift forklift', text: 'An Aether-Harbour night-shift forklift comes down your row, headlights on. The driver is whistling.', choices: [
    { id: 'duck', label: 'Duck behind the stacks', stat: 'stealth', diff: 5, ok: 'He passes three metres away, still whistling.', bad: 'He sees {op}, shouts, and reaches for his radio.', failHeat: 1 },
    { id: 'light', label: '{op} walks up and asks for a light', stat: 'social', diff: 6, ok: 'Two cigarettes and a moan about the night shift later, he drives off none the wiser.', bad: 'He doesn\'t buy it, and drives off fast with his radio at his mouth.', failHeat: 1 },
  ], abort: { label: 'Abort: back out before he gets closer', ok: 'You slip away between the containers.' } },
  stack: { name: 'Groaning stack', text: 'The wind shifts off the bay. A stack of rusted containers under you groans and starts to creep.', choices: [
    { id: 'brace', label: '{op} wedges a pry bar into the slipping corner', stat: 'tech', diff: 7, ok: 'Metal grinds on metal with a sharp pop, and the corner locks back in place.', bad: 'The bar snaps. A rusted panel shears off and clips {op}\'s shoulder.', failHurt: true },
    { id: 'clear', label: 'Get clear and let it settle', stat: 'stealth', diff: 4, payCut: 0.1, ok: 'A dull shudder runs through the pier, but the stack holds.', bad: 'A panel hits the deck with a boom, and a security drone comes to look.', failHeat: 1 },
  ], abort: { label: 'Abort: climb down and miss the drop', ok: 'You wait out the groaning on the ground. By the time it stops, so has the drop.' } },
  dog: { name: 'Dock dog', text: 'A feral dock dog, ribs showing through wet fur, snarls at the hum of your earpieces.', choices: [
    { id: 'feed', label: 'Toss it a strip of salted pork', stat: 'social', diff: 4, ok: 'It snaps the meat out of the air and trots off between the pallets.', bad: 'It ignores the meat and goes for {op}\'s forearm.', failHurt: true },
    { id: 'hiss', label: '{op} steps forward with a low hiss', stat: 'cool', diff: 5, ok: 'It cowers, turns tail and slinks off under a row of trailers.', bad: 'It yelps, loud, and a watchman\'s torch swings down your row.', failHeat: 1 },
  ], abort: { label: 'Abort: pack up and leave the post', ok: 'You leave the dog the pier. It seems to think that\'s fair.' } },
  backwards: { name: 'The Ferryman\'s cigarette', text: 'On the boat, the Ferryman lights a clove cigarette and turns it to face backwards. Everyone on the waterfront knows what that means.', choices: [
    { id: 'watch', label: 'Don\'t ask. Keep watching.', stat: 'cool', diff: 6, ok: 'Nothing comes. Maybe the cigarette is why.', bad: 'Something comes: a Red Lantern scooter, headlights off, rolling down the pier.', failHurt: true },
    { id: 'ask', label: '{op} asks him what\'s wrong', stat: 'social', diff: 7, ok: 'He looks at {op} for a long moment. "Nothing, now." He almost smiles.', bad: '"Don\'t ask," he says. "Just row." The rest of the night is colder.' },
    { id: 'tidewatch', label: '{op} watches the tide instead', stat: 'cool', diff: 4, needs: { stat: 'cool', min: 10, prep: 'tide' }, payBonus: 0.1, ok: '{op} spots drifting debris before it reaches the propeller, and the Ferryman quietly adds to the fee.', bad: '{op} reads it wrong, but keeps quiet enough not to offend him.' },
  ], abort: { label: 'Abort: if he\'s worried, you\'re leaving', ok: 'You back off the landing. "Cowards row slow," comes across the water.' } },
  boxed: { name: 'Boxed in', text: 'A container truck has parked across the only road out. The driver is asleep in the cab.', choices: [
    { id: 'thread', label: '{op} threads the van past it', stat: 'driving', diff: 6, ok: 'Wing mirror folded in, two centimetres to spare. The truck driver snores on.', bad: 'Metal screams on metal. The driver wakes up shouting.', failHeat: 1, failPay: 0.1 },
    { id: 'knock', label: 'Knock on the cab and ask nicely', stat: 'social', diff: 4, ok: 'He grumbles, moves the truck, and asks nothing. It\'s the Docks.', bad: 'He tells you exactly where to go, and doesn\'t move. You wait an hour.', failPay: 0.2 },
    { id: 'mirrors', label: 'Fold the mirrors and clear it in one pass', stat: 'driving', diff: 4, needs: { stat: 'driving', min: 13 }, payBonus: 0.1, ok: 'The van slips through with paint to spare.', bad: 'A mirror clips the truck on the way through.', failHeat: 1 },
  ], abort: { label: 'Abort: leave the van and walk out', ok: 'You walk home along the seawall and come back for the van at dawn.', payCut: 0.6 } },
};

const ROUTES = {
  seawall: { name: 'The seawall path', tests: 'stealth', bonus: 'stealth', crisis: 'cutter', blurb: 'Along the water under the fog. Quiet, but the police boats patrol here.',
    check: { stat: 'stealth', diff: 3, ok: '{op} finds the gap in the seawall fence and slips through.', bad: '{op} snags a sleeve on the fence wire. Noisy, but nobody comes.' } },
  gate: { name: 'The front gate', tests: 'social', bonus: 'social', crisis: 'whistler', blurb: 'Walk in on a borrowed dock pass. Fast, but the night shift is about.',
    check: { stat: 'social', diff: 3, ok: '{op} flashes the pass at the gatehouse. The guard doesn\'t look up.', bad: 'The guard squints at the pass for a long time, then waves {op} through anyway.' } },
  stacks: { name: 'Over the stacks', tests: 'tech', bonus: 'tech', crisis: 'stack', blurb: 'Up a rigged ladder and across the container tops. Nobody looks up, but the stacks are old.',
    check: { stat: 'tech', diff: 3, ok: '{op} rigs a cable ladder up the first stack in under a minute.', bad: 'The first ladder hook slips. {op} gets it on the second try, hands shaking.' } },
};
const EXITS = {
  van: { name: 'Van on the service road', blurb: 'Needs someone on Wheels. Quick, but the road out is narrow.' },
  boat: { name: 'Out with the Ferryman', blurb: 'No driver needed. He takes 15% of the pay for the ride.' },
};
const PREP = [
  { id: 'scanner', name: 'Police-band scanner', cost: 150, helps: 'cutter', does: 'Hear the police boat coming: −2 difficulty against it.', mods: { shadow: 2, splash: 2 } },
  { id: 'roster', name: 'Night-shift roster', cost: 200, helps: 'whistler', does: 'Know who\'s on and when: −2 against the forklift.', mods: { duck: 2, light: 2 } },
  { id: 'bar', name: 'A proper pry bar', cost: 100, helps: 'stack', does: 'Brace a slipping stack: −2 on bracing it.', mods: { brace: 2 } },
  { id: 'pork', name: 'Salted pork', cost: 50, helps: 'dog', does: 'For any dog on the pier: −3 on feeding it.', mods: { feed: 3 } },
  { id: 'tide', name: 'Tide chart', cost: 100, helps: 'backwards', does: 'Opens "watch the tide" for anyone, not just cool 10+.', mods: {} },
];
const POST_CRISES = ['dog', 'backwards'];
const PAY = 1600;

// ---------- Map geometry ----------
const P = { drop: [46, 226], seawall: [40, 96], gate: [196, 226], stacks: [150, 120], post: [292, 66], boat: [326, 176] };
const PATHS = {
  seawall: [P.drop, [30, 160], P.seawall, [150, 48], P.post],
  gate: [P.drop, P.gate, [282, 210], [300, 130], P.post],
  stacks: [P.drop, [100, 170], P.stacks, [230, 90], P.post],
};
const EXIT_PATHS = { van: [P.post, [250, 150], [120, 200], P.drop], boat: [P.post, [318, 120], P.boat] };
const pts = (list) => list.map((p) => p.join(',')).join(' ');

function mapSvg(plan) {
  const stacks = [[110, 30, 30, 22], [70, 140, 26, 40], [190, 150, 40, 26], [230, 30, 36, 20], [240, 170, 30, 30], [120, 80, 20, 26]];
  return `<svg viewBox="0 0 360 260" role="img" aria-label="Pier 12 map with routes in and out">
    <rect width="360" height="260" fill="#0b0d11"/>
    <path class="water" d="M0 0 H22 V260 H0 Z M340 0 H360 V260 H340 Z M300 196 Q340 200 360 196 V260 H300 Z"/>
    ${stacks.map(([x, y, w, h]) => `<rect class="stack" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`).join('')}
    ${Object.entries(PATHS).map(([k, l]) => `<polyline class="route ${plan.route === k ? 'on' : ''}" points="${pts(l)}"/>`).join('')}
    ${Object.entries(EXIT_PATHS).map(([k, l]) => `<polyline class="exit ${plan.exit === k ? 'on' : ''}" points="${pts(l)}"/>`).join('')}
    <circle class="node" cx="${P.drop[0]}" cy="${P.drop[1]}" r="7"/><text class="label ${plan.exit === 'van' ? 'hi' : ''}" x="${P.drop[0] - 12}" y="${P.drop[1] + 20}">DROP-OFF · VAN</text>
    <circle class="node" cx="${P.seawall[0]}" cy="${P.seawall[1]}" r="5"/><text class="label ${plan.route === 'seawall' ? 'hi' : ''}" x="${P.seawall[0] + 9}" y="${P.seawall[1] + 3}">SEAWALL</text>
    <circle class="node" cx="${P.gate[0]}" cy="${P.gate[1]}" r="5"/><text class="label ${plan.route === 'gate' ? 'hi' : ''}" x="${P.gate[0] - 14}" y="${P.gate[1] + 18}">GATE</text>
    <circle class="node" cx="${P.stacks[0]}" cy="${P.stacks[1]}" r="5"/><text class="label ${plan.route === 'stacks' ? 'hi' : ''}" x="${P.stacks[0] + 9}" y="${P.stacks[1] + 3}">STACKS</text>
    <circle class="node post" cx="${P.post[0]}" cy="${P.post[1]}" r="8"/><text class="label hi" x="${P.post[0] - 34}" y="${P.post[1] - 14}">STACK 409</text>
    <circle class="node" cx="${P.boat[0]}" cy="${P.boat[1]}" r="6"/><text class="label ${plan.exit === 'boat' ? 'hi' : ''}" x="${P.boat[0] - 46}" y="${P.boat[1] + 20}">FERRY LANDING</text>
    <g id="tokens"></g>
  </svg>`;
}
const TOKEN_COLORS = ['#36d6c3', '#ff4f7b', '#f5b942'];
function drawTokens(people) {
  const g = document.getElementById('tokens');
  if (!g) return;
  g.innerHTML = people.map((p, i) => `<g class="token" id="tok-${p.op.id}" style="transform: translate(${p.at[0] + i * 9 - 9}px, ${p.at[1] - 12}px)"><circle r="8" fill="${TOKEN_COLORS[i]}"/><text>${esc(p.op.handle.slice(0, 2).toUpperCase())}</text></g>`).join('');
}
function moveToken(op, i, at) {
  const t = document.getElementById(`tok-${op.id}`);
  if (t) t.style.transform = `translate(${at[0] + i * 9 - 9}px, ${at[1] - 12}px)`;
}

// ---------- Plan state ----------
const plan = { route: 'seawall', exit: 'van', point: 'rat', watch: 'mop', wheels: 'hotwire', prep: new Set(), callIn: 'risky', ifHurt: 'out' };
let seed = (Date.now() % 2147483647) | 0;

// Who handles each kind of trouble: Point on the way in, Watch at the post, Wheels on the way out.
// The other person walking in backs them up (+1 if they have 7+ in the stat), as in the game.
function rollFor(slotId, choice, crisisId) {
  const op = byId(plan[slotId]);
  const partnerId = slotId === 'point' ? plan.watch : slotId === 'watch' ? plan.point : null;
  const partner = partnerId ? byId(partnerId) : null;
  let value = op.stats[choice.stat];
  const notes = [`${choice.stat} ${op.stats[choice.stat]}`];
  if (slotId === 'point' && ROUTES[plan.route].bonus === choice.stat) { value += 1; notes.push(`${ROUTES[plan.route].name.toLowerCase()} +1`); }
  if (partner && partner.stats[choice.stat] >= 7) { value += 1; notes.push(`${partner.handle} backs up +1`); }
  let diff = choice.diff;
  for (const p of PREP) if (plan.prep.has(p.id) && p.mods[choice.id]) { diff -= p.mods[choice.id]; notes.push(`${p.name.toLowerCase()} −${p.mods[choice.id]}`); }
  const chance = chanceOf(value, diff);
  return { op, value, diff, need: 10 + diff, chance, risk: riskOf(chance), notes };
}
function available(choice, slotId) {
  if (!choice.needs) return true;
  if (choice.needs.prep && plan.prep.has(choice.needs.prep)) return true;
  return byId(plan[slotId]).stats[choice.needs.stat] >= choice.needs.min;
}
// The crew's own call: the best odds; on a tie, the option that costs nothing.
function crewPick(crisisId, slotId) {
  const opts = C[crisisId].choices.filter((c) => available(c, slotId)).map((c) => ({ c, r: rollFor(slotId, c, crisisId) }));
  opts.sort((a, b) => b.r.chance - a.r.chance || (a.c.payCut ?? 0) - (b.c.payCut ?? 0));
  return opts;
}
const slotsNeeded = () => (plan.exit === 'van' ? ['point', 'watch', 'wheels'] : ['point', 'watch']);
const fill = (t, op) => t.replaceAll('{op}', op.handle);

// ---------- Planning screen ----------
function renderPlan() {
  const app = document.getElementById('app');
  const crewOpts = (slot) => CREW.map((o) => {
    const taken = slotsNeeded().some((s) => s !== slot && plan[s] === o.id);
    return `<option value="${o.id}" ${plan[slot] === o.id ? 'selected' : ''} ${taken ? 'disabled' : ''}>${esc(o.handle)} · ${o.role} · ${MAIN[o.role]} ${o.stats[MAIN[o.role]]}</option>`;
  }).join('');
  const prepCost = [...plan.prep].reduce((n, id) => n + PREP.find((p) => p.id === id).cost, 0);
  const fare = plan.exit === 'boat' ? PAY * 0.15 : 0;

  // The read uses the same numbers as the run (shown risk = used risk).
  const best = (cid, slot) => crewPick(cid, slot)[0];
  const routeBest = best(ROUTES[plan.route].crisis, 'point');
  const postReads = POST_CRISES.map((cid) => ({ cid, b: best(cid, 'watch') }));
  const exitBest = plan.exit === 'van' ? best('boxed', 'wheels') : null;
  const readRow = (title, sub, b) => `<div class="read__row"><div><b>${esc(title)}</b><span class="muted small">${esc(sub)}</span></div><span class="pill r-${b.r.risk}">${b.r.risk}</span></div>`;

  app.innerHTML = `
    <header style="display:grid;gap:6px">
      <span class="eyebrow">Docks · Pier 12 · for the Ferryman · ${yen(PAY)}</span>
      <h1>Container 409</h1>
      <p class="brief">"Aether-Harbour dropped a crate on the gantry that isn't on their manifest. Container 409. Keep your eyes open, keep your mouths shut, and don't whistle."</p>
    </header>
    <p class="proto">Prototype: plan the job, then watch it play out. The crew only calls you in when the orders say so. Same roll rule and crises as the game; the map, slots and prep are new.</p>
    <div class="map">${mapSvg(plan)}</div>

    <section><h2>1 · Way in</h2><div class="opts">
      ${Object.entries(ROUTES).map(([k, r]) => `<label class="opt"><input type="radio" name="route" value="${k}" ${plan.route === k ? 'checked' : ''}><b>${esc(r.name)}</b><span>${esc(r.blurb)} Point gets ${r.bonus} +1. Likely trouble: ${esc(C[r.crisis].name.toLowerCase())}.</span></label>`).join('')}
    </div></section>

    <section><h2>2 · Way out</h2><div class="opts">
      ${Object.entries(EXITS).map(([k, e]) => `<label class="opt"><input type="radio" name="exit" value="${k}" ${plan.exit === k ? 'checked' : ''}><b>${esc(e.name)}</b><span>${esc(e.blurb)}</span></label>`).join('')}
    </div></section>

    <section><h2>3 · Who does what</h2>
      <div class="slot"><label for="s-point">Point</label><span class="why">Goes first. Handles trouble on the way in.</span><select id="s-point" data-slot="point">${crewOpts('point')}</select></div>
      <div class="slot"><label for="s-watch">Watch</label><span class="why">Holds the post at Stack 409. Handles whatever turns up there.</span><select id="s-watch" data-slot="watch">${crewOpts('watch')}</select></div>
      ${plan.exit === 'van' ? `<div class="slot"><label for="s-wheels">Wheels</label><span class="why">Waits in the van. Handles the road out.</span><select id="s-wheels" data-slot="wheels">${crewOpts('wheels')}</select></div>` : ''}
    </section>

    <section><h2>4 · Prep</h2><p class="muted small">Bought before the job. Only pays off if that trouble turns up.</p><div class="opts">
      ${PREP.map((p) => `<label class="opt"><input type="checkbox" name="prep" value="${p.id}" ${plan.prep.has(p.id) ? 'checked' : ''}><b>${esc(p.name)} <span class="cost">${yen(p.cost)}</span></b><span>${esc(p.does)}</span></label>`).join('')}
    </div></section>

    <section><h2>5 · Orders</h2>
      <p class="small">Call me in…</p>
      <div class="seg" data-order="callIn">
        ${[['every', 'Every time'], ['risky', 'When it\'s risky'], ['never', 'Never']].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${plan.callIn === v}">${l}</button>`).join('')}
      </div>
      <p class="muted small">"Risky" means the crew's best option is high risk or worse. On "never", they pull out themselves if every option is extreme.</p>
      <p class="small">If someone gets hurt…</p>
      <div class="seg" data-order="ifHurt">
        ${[['out', 'Get them out'], ['finish', 'Finish the job']].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${plan.ifHurt === v}">${l}</button>`).join('')}
      </div>
    </section>

    <section><h2>Risk read</h2><div class="read">
      ${readRow(`Way in: ${C[ROUTES[plan.route].crisis].name}`, `${routeBest.r.op.handle}, best option: ${routeBest.c.id === 'abort' ? 'abort' : fill(routeBest.c.label, routeBest.r.op).toLowerCase()} (${routeBest.r.notes.join(', ')})`, routeBest)}
      ${postReads.map(({ cid, b }) => readRow(`At the post, maybe: ${C[cid].name}`, `${b.r.op.handle} (${b.r.notes.join(', ')})`, b)).join('')}
      ${exitBest ? readRow('Way out: the service road', `${exitBest.r.op.handle} (${exitBest.r.notes.join(', ')})`, exitBest) : `<div class="read__row"><div><b>Way out: the Ferryman's boat</b><span class="muted small">No trouble expected. He takes 15%.</span></div><span class="pill r-certain">safe</span></div>`}
      <div class="net"><span>If it runs clean</span><span>${yen(PAY - fare - prepCost)}</span></div>
    </div></section>

    <button class="btn sticky" id="go">Send them</button>
    <p class="seed">Run seed ${seed}</p>`;

  app.querySelectorAll('input[name=route]').forEach((i) => i.addEventListener('change', () => { plan.route = i.value; renderPlan(); }));
  app.querySelectorAll('input[name=exit]').forEach((i) => i.addEventListener('change', () => { plan.exit = i.value; fixSlots(); renderPlan(); }));
  app.querySelectorAll('input[name=prep]').forEach((i) => i.addEventListener('change', () => { i.checked ? plan.prep.add(i.value) : plan.prep.delete(i.value); renderPlan(); }));
  app.querySelectorAll('select[data-slot]').forEach((s) => s.addEventListener('change', () => { plan[s.dataset.slot] = s.value; renderPlan(); document.getElementById(s.id)?.focus(); }));
  app.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { plan[seg.dataset.order] = b.dataset.v; renderPlan(); })));
  document.getElementById('go').addEventListener('click', run);
}
function fixSlots() {
  const used = new Set();
  for (const s of slotsNeeded()) {
    if (used.has(plan[s])) plan[s] = CREW.find((o) => !used.has(o.id)).id;
    used.add(plan[s]);
  }
}

// ---------- The run: a timed feed, tokens on the map, call-ins ----------
let fast = false;
const wait = (ms) => new Promise((r) => setTimeout(r, fast ? 60 : ms));

async function run() {
  const rng = mulberry32(seed);
  const d20 = () => 1 + Math.floor(rng() * 20);
  const slots = slotsNeeded();
  const people = slots.filter((s) => s !== 'wheels').map((s) => ({ op: byId(plan[s]), at: P.drop }));
  const wheels = plan.exit === 'van' ? byId(plan.wheels) : null;
  const log = { heat: 0, payCut: 0, payBonus: 0, hurt: [], aborted: false, pulledOut: false, callIns: 0, met: [], used: new Set(), postDone: false, events: [] };
  fast = false;

  const app = document.getElementById('app');
  app.innerHTML = `
    <header style="display:grid;gap:4px"><span class="eyebrow">Live · Pier 12</span><h1>Container 409</h1></header>
    <div class="map">${mapSvg(plan)}</div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <button class="btn btn--ghost sticky" id="skip">Speed up</button>`;
  drawTokens(people.concat(wheels ? [{ op: wheels, at: P.drop }] : []));
  document.getElementById('skip').addEventListener('click', () => { fast = true; });
  const feed = document.getElementById('feed');
  const say = async (html, cls = '', ms = 1100) => {
    const div = document.createElement('div');
    div.className = `line ${cls}`;
    div.innerHTML = html;
    feed.appendChild(div);
    div.querySelectorAll('.dice').forEach((b) => b.addEventListener('click', () => { b.nextElementSibling.hidden = !b.nextElementSibling.hidden; }));
    div.scrollIntoView({ block: 'nearest', behavior: fast ? 'auto' : 'smooth' });
    await wait(ms);
  };
  const diceHtml = (roll, die) => `<button class="dice" type="button">dice</button><span class="dice-detail" hidden>die ${die} + ${roll.value} (${esc(roll.notes.join(', '))}) = ${die + roll.value} · needs ${roll.need}</span>`;
  const walk = async (pathPoints, who) => {
    for (const pt of pathPoints.slice(1)) { who.forEach((p, i) => moveToken(p.op, people.includes(p) ? i : 2, pt)); await wait(500); }
  };

  const smallCheck = async (chk, op, stat) => {
    const v = op.stats[stat];
    const die = d20();
    const ok = die + v >= 10 + chk.diff;
    await say(`${esc(fill(ok ? chk.ok : chk.bad, op))} <span class="muted">(${stat} ${ok ? '✓' : '✗'})</span>`, 'check', 1000);
  };

  // One crisis: the crew decides under the orders, or calls you in. Returns false if the job ends here.
  const crisis = async (cid, slotId) => {
    const cr = C[cid];
    log.met.push(cid);
    for (const p of PREP) if (p.helps === cid && plan.prep.has(p.id)) log.used.add(p.id);
    await say(esc(cr.text), 'crisis', 1300);
    const opts = crewPick(cid, slotId);
    const bestOpt = opts[0];
    const op = byId(plan[slotId]);
    let picked;
    const callNow = plan.callIn === 'every' || (plan.callIn === 'risky' && bestOpt.r.chance < 0.5);
    if (callNow) {
      log.callIns++;
      picked = await callIn(cr, opts, op);
    } else if (plan.callIn === 'never' && bestOpt.r.chance < 0.3) {
      picked = { abort: true };
      await say(`${esc(op.handle)} doesn't like any of it. Under your orders, they pull out.`, 'why', 900);
    } else {
      picked = bestOpt;
      const why = opts.length > 1 && opts[1].r.chance === bestOpt.r.chance ? 'the same odds, and it costs nothing' : 'the best odds they had';
      await say(`${esc(op.handle)}'s call: ${esc(fill(bestOpt.c.label, op).toLowerCase())}. ${why[0].toUpperCase() + why.slice(1)} (${bestOpt.r.risk}).`, 'why', 900);
    }
    if (picked.abort) {
      log.aborted = true;
      log.payCut = 1;
      if (cr.abort.payCut != null && log.postDone) log.payCut = cr.abort.payCut;
      log.events.push({ cid, abort: true });
      await say(esc(cr.abort.ok), 'bad', 1100);
      return false;
    }
    const { c, r } = picked;
    const die = d20();
    const ok = die + r.value >= r.need;
    if (c.payCut) log.payCut += c.payCut;
    if (ok && c.payBonus) log.payBonus += c.payBonus;
    if (!ok) { log.heat += c.failHeat ?? 0; log.payCut += c.failPay ?? 0; if (c.failHurt) log.hurt.push(op.handle); }
    if (c.id === 'tidewatch' && plan.prep.has('tide') && op.stats.cool < 10) log.used.add('tide');
    log.events.push({ cid, c, op: op.handle, ok, die, r });
    await say(`${esc(fill(ok ? c.ok : c.bad, op))} ${diceHtml(r, die)}`, ok ? 'good' : 'bad', 1300);
    if (!ok && c.failHeat) await say(`Heat +${c.failHeat}.`, 'check', 700);
    if (!ok && c.failHurt) {
      await say(`${esc(op.handle)} is hurt. Light: they can walk.`, 'bad', 900);
      if (plan.ifHurt === 'out') {
        log.pulledOut = true;
        await say(`Your orders: get them out. The crew pulls back${log.postDone ? '. The crate is already off the gantry' : ' before the drop'}.`, 'why', 1100);
        return false;
      }
      await say('Your orders: finish the job. They keep going.', 'why', 900);
    }
    return true;
  };

  // A call-in: the feed waits for the player. Every call-in has an exit.
  const callIn = (cr, opts, op) => new Promise((resolve) => {
    const box = document.createElement('div');
    box.className = 'callin';
    const crewChoice = opts[0];
    box.innerHTML = `<span class="eyebrow">${esc(op.handle)} is calling in</span>
      <p>"${esc(cr.name)}. What do we do?" <span class="muted small">They'd go for: ${esc(fill(crewChoice.c.label, op).toLowerCase())}.</span></p>
      ${opts.map((o, i) => `<button class="choice" data-i="${i}"><span class="top"><span>${esc(fill(o.c.label, op))}</span><span class="pill r-${o.r.risk}">${o.r.risk}</span></span><span class="sub">${esc(o.r.notes.join(', '))}${o.c.payCut ? ` · pay −${o.c.payCut * 100}%` : ''}${o.c.failHurt ? ' · can hurt' : ''}${o.c.failHeat ? ' · heat if it fails' : ''}</span></button>`).join('')}
      <button class="choice" data-i="abort"><span class="top"><span>${esc(cr.abort.label)}</span><span class="pill r-certain">certain</span></span><span class="sub">Nobody's hurt. You lose the pay.</span></button>`;
    feed.appendChild(box);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    box.querySelector('button').focus({ preventScroll: true });
    box.querySelectorAll('button.choice').forEach((b) => b.addEventListener('click', () => {
      const i = b.dataset.i;
      box.querySelectorAll('button').forEach((x) => { x.disabled = true; });
      b.style.borderColor = 'var(--accent-2)';
      resolve(i === 'abort' ? { abort: true } : opts[Number(i)]);
    }));
  });

  // Approach
  await say('Pier 12 at midnight. Amber floodlights burn through the salt fog, turning the container stacks into canyons.', 'beat', 1500);
  if (wheels) await say(`${esc(wheels.handle)} parks the van on the service road with the lights off.`, 'check', 900);
  const route = ROUTES[plan.route];
  const point = byId(plan.point);
  const path = PATHS[plan.route];
  await walk(path.slice(0, 3), people);
  await smallCheck(route.check, point, route.check.stat);
  let going = await crisis(route.crisis, 'point');

  // The post
  if (going) {
    await walk(path.slice(2), people);
    await say('Cranes screech overhead and diesel fumes roll across the wet tarmac. Nobody whistles.', 'beat', 1300);
    await smallCheck({ diff: 2, ok: '{op} settles in at the corner of Stack 409 with a clear view of the gantry.', bad: '{op} can\'t settle; keeps checking over a shoulder.' }, byId(plan.watch), 'cool');
    const postCrisis = POST_CRISES[Math.floor(rng() * POST_CRISES.length)];
    going = await crisis(postCrisis, 'watch');
    if (going) { log.postDone = true; await say('Out past the breakwater, a police cutter\'s searchlight slices the mist and moves on. The crate comes down and goes into the Ferryman\'s boat.', 'beat', 1300); }
  }

  // The way out (always walked, even after a pull-out)
  if (plan.exit === 'van') {
    await walk(EXIT_PATHS.van, people);
    if (going) {
      people.forEach((p, i) => moveToken(p.op, i, P.drop));
      going = await crisis('boxed', 'wheels');
    }
  } else {
    await walk(EXIT_PATHS.boat, people);
    if (going) await say('The Ferryman rows you out with the crate under a tarp. He doesn\'t say a word the whole way.', 'beat', 1200);
  }
  if (log.pulledOut && log.postDone) log.payCut = Math.max(log.payCut, 0.5);
  else if (log.pulledOut) log.payCut = 1;
  await wait(600);
  renderReport(log);
}

// ---------- Report: what happened, and whether the plan was right ----------
function renderReport(log) {
  const prepCost = [...plan.prep].reduce((n, id) => n + PREP.find((p) => p.id === id).cost, 0);
  const cut = Math.min(1, log.payCut - log.payBonus);
  const gross = Math.round((PAY * (1 - cut)) / 50) * 50;
  const fare = plan.exit === 'boat' && !log.aborted ? Math.round((gross * 0.15) / 50) * 50 : 0;
  const net = gross - fare - prepCost;
  const clean = !log.aborted && !log.pulledOut && !log.heat && !log.hurt.length;
  const joss = log.aborted ? 'Nobody hurt, nobody paid. Some nights are like that.'
    : log.pulledOut ? `${log.hurt[0]} is hurt, and you pulled them out like you said you would. ${log.postDone ? 'The Ferryman paid half.' : 'No pay tonight.'}`
    : log.hurt.length ? `We got paid. ${log.hurt.join(' and ')} got hurt doing it. Light, they'll live.`
    : log.heat ? 'We got paid. We also got noticed.'
    : 'Clean. The Ferryman paid and didn\'t even count it.';

  const checks = [];
  checks.push(`${ROUTES[plan.route].name}: ${log.met.includes(ROUTES[plan.route].crisis) ? `the ${C[ROUTES[plan.route].crisis].name.toLowerCase()} came, as expected.` : 'never reached.'}`);
  for (const p of PREP.filter((x) => plan.prep.has(x.id))) {
    checks.push(log.used.has(p.id) ? `${p.name}: it came into play.` : `${p.name}: never needed (${yen(-p.cost)}).`);
  }
  for (const e of log.events.filter((x) => !x.abort)) checks.push(`${e.op} on ${C[e.cid].name.toLowerCase()}: ${e.ok ? 'passed' : 'failed'} (${e.r.risk} risk).`);
  checks.push(log.callIns ? `You were called in ${log.callIns} time${log.callIns > 1 ? 's' : ''}.` : 'The crew never called you in.');
  if (log.pulledOut) checks.push('Your "if someone gets hurt" order was used.');

  document.getElementById('app').innerHTML = `
    <header style="display:grid;gap:4px"><span class="eyebrow">Report · Container 409</span><h1>${clean ? 'Clean job' : log.aborted ? 'Aborted' : log.pulledOut ? 'Pulled out' : 'Done, with costs'}</h1></header>
    <div class="report">
      <p class="joss">${esc(joss)} <span class="muted">— Joss</span></p>
      <div class="facts">
        <div class="fact"><b>${yen(net)}</b><span>Net</span></div>
        <div class="fact"><b>+${log.heat}</b><span>Heat</span></div>
        <div class="fact"><b>${log.hurt.length}</b><span>Hurt</span></div>
      </div>
      <section><h2>Did the plan work?</h2><ul class="check">${checks.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></section>
      <section><h2>Money</h2><div class="money">
        <div><span>Job pays</span><span>${yen(PAY)}</span></div>
        ${gross !== PAY ? `<div><span>Cuts and bonuses</span><span>${yen(gross - PAY)}</span></div>` : ''}
        ${fare ? `<div><span>Ferryman's fare</span><span>${yen(-fare)}</span></div>` : ''}
        ${prepCost ? `<div><span>Prep</span><span>${yen(-prepCost)}</span></div>` : ''}
        <div><span>Net</span><span>${yen(net)}</span></div>
      </div></section>
      <div class="btns">
        <button class="btn" id="again">Same plan again</button>
        <button class="btn btn--ghost" id="change">Change plan</button>
      </div>
      <p class="seed">Seed ${seed}. "Same plan again" rolls new dice.</p>
    </div>`;
  document.getElementById('again').addEventListener('click', () => { seed = (seed * 48271) % 2147483647; run(); });
  document.getElementById('change').addEventListener('click', () => { seed = (seed * 48271) % 2147483647; renderPlan(); window.scrollTo(0, 0); });
  window.scrollTo(0, 0);
}

renderPlan();
</script>
